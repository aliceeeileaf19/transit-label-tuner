/* =========================== Boot =====================================
   Wait for real dimensions: while the container is 0x0, getScreenCTM() and
   every viewBox conversion return NaN and the whole model comes out wrong.
   ===================================================================== */
function waitSize(el){
  return new Promise(res=>{
    let n = 0;
    const tick = ()=>{
      const r = el.getBoundingClientRect();
      const m = el.getScreenCTM();
      if(r.width>1 && r.height>1 && m && isFinite(m.a) && m.a!==0) return res(true);
      if(++n > 600) return res(false);
      nextFrame().then(tick);
    };
    nextFrame().then(tick);
  });
}

async function fingerprintText(text){
  if(globalThis.crypto && crypto.subtle){
    const bytes=new TextEncoder().encode(text);
    const digest=await crypto.subtle.digest("SHA-256",bytes);
    return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  /* Web Crypto requires a secure context outside localhost. Keep drafts
     separated in older/insecure browsers with a deterministic fallback. */
  let a=2166136261, b=2246822519;
  for(let i=0;i<text.length;i++){
    const c=text.charCodeAt(i); a=Math.imul(a^c,16777619); b=Math.imul(b^c,3266489917);
  }
  return "fnv1a-"+(a>>>0).toString(16).padStart(8,"0")
    +(b>>>0).toString(16).padStart(8,"0")+"-"+text.length;
}

/* SVG is data, not application code. Parse it in the SVG namespace and remove
   features that can execute script or fetch a third-party resource before the
   document is adopted into this page. Fragment references such as url(#mask)
   and href="#symbol" remain available because maps rely on them. This is a
   defence-in-depth boundary; the README still tells users to open only maps
   they trust. */
const SVG_NS="http://www.w3.org/2000/svg";
let SANITIZED_ITEMS=0;
function safeSvgCss(css){
  return String(css)
    .replace(/@import\s+[^;]+;?/gi, "")
    .replace(/url\(\s*(['"]?)(.*?)\1\s*\)/gi, (all,q,target)=>
      String(target).trim().startsWith("#") ? all : "none");
}
function parseSafeSvg(text, path){
  const doc=new DOMParser().parseFromString(text,"image/svg+xml");
  const svg=doc.documentElement;
  if(doc.doctype || !svg || svg.localName!=="svg" || svg.namespaceURI!==SVG_NS ||
     doc.querySelector("parsererror"))
    throw new Error(t("boot.err.unsafeSvg",{path}));

  const blocked=new Set(["script","foreignobject","iframe","object","embed",
    "audio","video","animate","animatemotion","animatetransform","set","discard"]);
  SANITIZED_ITEMS=0;
  for(const el of [svg,...svg.querySelectorAll("*")]){
    if(el!==svg && (el.namespaceURI!==SVG_NS || blocked.has(el.localName.toLowerCase()))){
      el.remove(); SANITIZED_ITEMS++; continue;
    }
    for(const attr of [...el.attributes]){
      const name=attr.name.toLowerCase(), value=attr.value.trim();
      if(name.startsWith("on") || /^javascript:/i.test(value) ||
         ((name==="href" || name==="xlink:href" || name==="src") &&
          value && !value.startsWith("#"))){
        el.removeAttributeNode(attr); SANITIZED_ITEMS++; continue;
      }
      if(name==="style"){
        const clean=safeSvgCss(attr.value);
        if(clean!==attr.value){
          clean.trim() ? el.setAttribute(attr.name,clean) : el.removeAttributeNode(attr);
          SANITIZED_ITEMS++;
        }
      }
    }
    if(el.localName.toLowerCase()==="style"){
      const clean=safeSvgCss(el.textContent);
      if(clean!==el.textContent){ el.textContent=clean; SANITIZED_ITEMS++; }
    }
  }
  return document.importNode(svg,true);
}

async function boot(){
  try{
    const bootStep = key=>{ const el=$("#boot small"); if(el) el.textContent=t(key); };
    bootStep("boot.step.inline");
    const response=await fetch(SVG_PATH);
    if(!response.ok) throw new Error(t("boot.err.load", {path:SVG_PATH}));
    const txt=await response.text();
    if(!SOURCE_FINGERPRINT || SOURCE_FINGERPRINT==="__SOURCE_SHA256__")
      SOURCE_FINGERPRINT=await fingerprintText(txt);
    root=parseSafeSvg(txt,SVG_PATH);
    host.replaceChildren(root);
    root.setAttribute("id","tlt-root");   /* stable id for CSS and test hooks */
    const vb = (root.getAttribute("viewBox")||"0 0 1684 1188").trim().split(/[\s,]+/).map(Number);
    VB = {w:vb[2], h:vb[3]}; baseW = vb[2];
    root.removeAttribute("width"); root.removeAttribute("height");
    root.style.width = baseW+"px"; root.style.height = "auto";

    /* Station coordinates live in the <svg> that wraps the station groups —
       usually an inner <svg> with its own viewBox. Fall back to the root. */
    const anyStn = root.querySelector(SEL.station);
    mapEl = (anyStn && anyStn.parentNode.closest("svg")) || root;

    bootStep("boot.step.outerSize");
    if(!await waitSize(root)) throw new Error(t("boot.err.outerSize"));
    bootStep("boot.step.innerCoords");
    if(!await waitSize(mapEl)) throw new Error(t("boot.err.innerSize"));
    syncCTM();
    if(!mapCTM || !isFinite(mapCTM.a) || mapCTM.a===0) throw new Error(t("boot.err.ctm"));
    bootStep("boot.step.index");
    buildModel();
    $("#srcName").textContent = SVG_PATH.split("/").pop();
    $("#boot").remove();
    fitAll();
    updateMovedCount();
    const loadedText = ()=> t("boot.loaded", {
      stations:M.stations.length, labels:M.labels.length, codes:M.codes.length,
      leaders:M.labels.filter(L=>L.ldr).length, panels:M.panels.length})+
      (SANITIZED_ITEMS ? t("boot.sanitized",{n:SANITIZED_ITEMS}) : "");
    const automated = qs.has("test") || qs.has("uitest");
    if(automated){
      await vetoAllAsync();
      setInfo(loadedText());
    }else{
      $("#btnExport").disabled = true;
      $("#btnExport").title = t("boot.exportWhenDone");
      setInfo(t("boot.checking"));
      nextFrame().then(async()=>{
        await vetoAllAsync();
        $("#btnExport").disabled = false;
        $("#btnExport").removeAttribute("title");
        setInfo(loadedText());
        scheduleCount();
      });
    }
    window.__ready = true;
    runTest();
  }catch(err){
    const bootEl=$("#boot"); bootEl.textContent="";
    const msg=document.createElement("span");msg.className="err";msg.textContent=err.message;
    bootEl.appendChild(msg);
    document.title = "RESULT"+JSON.stringify({error:err.message});
    window.__ready = "error";
  }
}

/* ?test=<json>  e.g. {"ops":[{"t":"name","key":"Riverside|R05","dx":0,"dy":18},
                             {"t":"code","key":"Central Exchange|B05|B05","dx":-8,"dy":1}]}
   The result is written into document.title so a headless --dump-dom can
   read it back without needing a screenshot. */
function runTest(){
  const raw = qs.get("test");
  if(!raw) return;
  const res = {ops:[], errors:[]};
  try{
    const spec = JSON.parse(raw);
    for(const op of (spec.ops||[])){
      try{
        if(op.t==="name")      res.ops.push(window.applyMove(op.key, op.dx||0, op.dy||0));
        else if(op.t==="code") res.ops.push(window.applyCodeMove(op.key, op.dx||0, op.dy||0));
        else if(op.t==="angle")res.ops.push(window.applyAngle(op.key, op.ang));
        else if(op.t==="zoom"){ zoom = op.z; applyView(); res.ops.push({zoom:zoom, scale:userScale()}); }
        else if(op.t==="dragpx"){
          /* dx/dy arrive in map units; convert to screen pixels first */
          const k = userScale();
          res.ops.push(window.dragPx(op.key, (op.dx||0)*k, (op.dy||0)*k, op.kind));
        }
        else if(op.t==="undo"){ window.undo(); res.ops.push({undo:true}); }
        else if(op.t==="focus"){ res.ops.push(window.focusOn(op.key, op.z||6)); }
        else if(op.t==="focusLabel"){
          const L=M.byKey.get(op.key);if(!L)throw new Error("Not found: "+op.key);
          L.el.focus();res.ops.push({focusLabel:op.key,active:document.activeElement===L.el,
            aria:L.el.getAttribute("aria-label")});
        }
        else if(op.t==="click"){ const b=$(op.sel); if(!b) throw new Error("Selector not found: "+op.sel);
                                 b.click(); res.ops.push({click:op.sel}); }
        else if(op.t==="key"){
          for(let i=0;i<(op.n||1);i++)
            window.dispatchEvent(new KeyboardEvent("keydown",{key:op.k,bubbles:true,cancelable:true}));
          res.ops.push({key:op.k, n:op.n||1,
                        sel: sel ? {x:sel.x, y:sel.y} : null});
        }
        else if(op.t==="hover"){ const L=M.byKey.get(op.key); if(!L) throw new Error("Not found: "+op.key);
                                 hot(L, L.code); if(op.select) select(L, L, "name");
                                 res.ops.push({hover:op.key, code:L.code?L.code.text:null, ldr:!!L.ldr}); }
        else res.errors.push("unknown op: "+op.t);
      }catch(e){ res.errors.push(String(e.message||e)); }
    }
    recount();
    res.export = exportRows();
    res.text = exportText();
    res.counts = window.__counts;
    res.vetoNow = M.labels.filter(L=>L.veto).map(L=>L.text);
    res.panels = M.panels.map(q=>({fill:q.fill, b:{x0:+q.b.x0.toFixed(1), x1:+q.b.x1.toFixed(1),
                                                   y0:+q.b.y0.toFixed(1), y1:+q.b.y1.toFixed(1)}}));
    res.model = {stations:M.stations.length, labels:M.labels.length,
                 codes:M.codes.length, leaders:M.labels.filter(L=>L.ldr).length,
                 panels:M.panels.length, mapScale:+userScale().toFixed(6),
                 mapViewBox:(mapEl.getAttribute("viewBox")||""),
                 tabbableLabels:M.labels.filter(L=>L.el.getAttribute("tabindex")==="0").length};
  }catch(e){ res.errors.push("could not parse ?test= : "+String(e.message||e)); }
  const json = JSON.stringify(res);
  document.title = "RESULT"+json;
  /* Also expose it as a hidden #testresult node: a title is size-limited and
     easily clobbered by anything else that sets it. */
  const pre=document.createElement("pre"); pre.id="testresult";
  pre.textContent=json; pre.style.display="none"; document.body.appendChild(pre);
}

boot();
</script>

<script>
"use strict";
/* =======================================================================
   Extension layer 1: layout blocks and leader endpoints.
     · blocks (title, legend, cards, footer): drag and scale as a unit
     · leaders: drag the *label* end on its own

   Written as a layer on purpose — not a single line of the main program is
   modified, so the geometry above stays the only definition of what counts
   as an overlap. Events are intercepted in the capture phase and
   stopPropagation() only fires when a block or leader was really grabbed;
   everything else falls through to the name/code handlers untouched.
   ======================================================================= */
const EXT = {blocks:[], leaders:[], sel:null, drag:null, undo:[]};
const EXT_BLOCKS = CONFIG.blocks.map(b=>[b.id, b.key]);
const efmt = v => Math.round(v*10)/10;

function extCorners(el){
  /* getBBox() excludes the element's own transform. A block that carries a
     translate+scale must have it multiplied back in, or the box lands in the
     wrong place and the overlap count runs into the thousands. */
  const b=el.getBBox();
  let pts=[[b.x,b.y],[b.x+b.width,b.y],[b.x+b.width,b.y+b.height],[b.x,b.y+b.height]];
  const c=el.transform && el.transform.baseVal.consolidate();
  if(c){ const m=c.matrix; pts=pts.map(([x,y])=>[m.a*x+m.c*y+m.e, m.b*x+m.d*y+m.f]); }
  return pts;
}
/* Block captions come from the translation table, so they follow the UI. */
function blockLabel(b){ return t(b.labelKey); }

function extBoot(){
  /* --- blocks: wrap each one, then only ever touch the wrapper's transform --- */
  for(const [id,labelKey] of EXT_BLOCKS){
    const el = host.querySelector('#'+CSS.escape(id));
    if(!el) continue;
    const wrap = document.createElementNS("http://www.w3.org/2000/svg","g");
    wrap.setAttribute("class","ext-wrap");
    el.parentNode.insertBefore(wrap, el); wrap.appendChild(el);
    const q = extCorners(el);          // element transform already applied
    const xs=q.map(p=>p[0]), ys=q.map(p=>p[1]);
    EXT.blocks.push({id, labelKey, el, wrap, inner: mapEl.contains(wrap), dx:0, dy:0, s:1,
                     cx:(Math.min(...xs)+Math.max(...xs))/2, cy:(Math.min(...ys)+Math.max(...ys))/2});
  }
  /* --- leaders --- */
  for(const el of mapEl.querySelectorAll(SEL.leader)){
    const g = k => parseFloat(el.getAttribute(k));
    EXT.leaders.push({el, x20:g("x2"), y20:g("y2"), dx:0, dy:0,
                      x1:g("x1"), y1:g("y1")});
  }
  extRender();
  window.__ext = EXT;
}
function extPaint(b){
  const t = "translate("+efmt(b.dx)+","+efmt(b.dy)+") "
          + "translate("+efmt(b.cx)+","+efmt(b.cy)+") scale("+efmt(b.s*1000)/1000+") "
          + "translate("+efmt(-b.cx)+","+efmt(-b.cy)+")";
  b.wrap.setAttribute("transform", t);
}
function extPaintLdr(l){
  l.el.setAttribute("x2", efmt(l.x20 + l.dx));
  l.el.setAttribute("y2", efmt(l.y20 + l.dy));
}
function extPushUndo(){
  EXT.undo.push({b:EXT.blocks.map(b=>({b,dx:b.dx,dy:b.dy,s:b.s})),
                 l:EXT.leaders.map(l=>({l,dx:l.dx,dy:l.dy}))});
  if(EXT.undo.length>200) EXT.undo.shift();
}
function extUndo(){
  const st=EXT.undo.pop(); if(!st) return;
  for(const r of st.b){ r.b.dx=r.dx; r.b.dy=r.dy; r.b.s=r.s; extPaint(r.b); }
  for(const r of st.l){ r.l.dx=r.dx; r.l.dy=r.dy; extPaintLdr(r.l); }
  extRender(); scheduleCount();
}
/* Block collision test: reuse the main program's names, codes, stations and
   panels, plus a sampled version of the route paths. */
let EXT_OBS = null;
function extObstacles(){
  if(EXT_OBS) return EXT_OBS;
  const o=[];
  for(const p of mapEl.querySelectorAll(SEL.route)){
    const L=p.getTotalLength(); if(!L) continue;
    let pr=p.getPointAtLength(0);
    for(let d=6; d<=L; d+=6){ const q=p.getPointAtLength(d);
      o.push({x0:Math.min(pr.x,q.x)-8,y0:Math.min(pr.y,q.y)-8,x1:Math.max(pr.x,q.x)+8,y1:Math.max(pr.y,q.y)+8}); pr=q; }
  }
  for(const s of M.stations) o.push({x0:s.x-12,y0:s.y-12,x1:s.x+12,y1:s.y+12});
  for(const L2 of M.labels){ const b=bounds(userCorners(L2.el)); o.push({x0:b.x0-4,y0:b.y0-4,x1:b.x1+4,y1:b.y1+4}); }
  for(const c of M.codes){ const b=bounds(userCorners(c.el)); o.push({x0:b.x0-4,y0:b.y0-4,x1:b.x1+4,y1:b.y1+4}); }
  EXT_OBS=o; return o;
}
function extInnerBox(b){
  let pts=extCorners(b.el);
  /* then the wrapper: scale about the block centre, then translate */
  pts=pts.map(([x,y])=>[b.cx+(x-b.cx)*b.s+b.dx, b.cy+(y-b.cy)*b.s+b.dy]);
  let xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  if(b.inner) return {x0,y0,x1,y1};
  const vb=(mapEl.getAttribute("viewBox")||"0 0 1684 1188").split(/\s+/).map(Number);
  const w=+mapEl.getAttribute("width")||1684, h=+mapEl.getAttribute("height")||1188;
  const mx=+mapEl.getAttribute("x")||0, my=+mapEl.getAttribute("y")||0;
  const k=Math.min(w/vb[2],h/vb[3]);
  const ox=mx+(w-vb[2]*k)/2, oy=my+(h-vb[3]*k)/2;
  return {x0:vb[0]+(x0-ox)/k, x1:vb[0]+(x1-ox)/k, y0:vb[1]+(y0-oy)/k, y1:vb[1]+(y1-oy)/k};
}
function extHits(b){
  const B=extInnerBox(b); let n=0;
  for(const o of extObstacles()) if(!(o.x1<B.x0||o.x0>B.x1||o.y1<B.y0||o.y0>B.y1)) n++;
  return n;
}
function extRender(){
  let tot=0;
  const rows=EXT.blocks.map(b=>{
    b.hits=extHits(b); tot+=b.hits;
    b.wrap.style.outline = b.hits? "3px dashed #b3261e" : "";
    return '<tr class="'+(EXT.sel===b?"sel":"")+'"><td>'+blockLabel(b)+'</td>'
      +'<td class="n">'+efmt(b.dx)+'</td><td class="n">'+efmt(b.dy)+'</td>'
      +'<td class="n">'+Math.round(b.s*100)+'%</td>'
      +'<td class="'+(b.hits?"err":"")+'">'+(b.hits?t("ext.hit"):t("ext.ok"))+'</td></tr>';
  }).join("");
  const nl=EXT.leaders.filter(l=>l.dx||l.dy).length;
  $("#extTable").innerHTML =
    '<tr><td><b>'+t("ext.blocks")+'</b></td><td class="n">dx</td><td class="n">dy</td>'
    +'<td class="n">'+t("ext.size")+'</td><td></td></tr>'+rows
    +'<tr><td colspan="5" style="padding-top:4px;color:#555">'
    +t("ext.leadersAdjusted",{n:nl})+'</td></tr>';
  $("#extHit").innerHTML = tot? '<span class="err">'+t("ext.totalHits",{n:tot})+'</span>'
                              : t("ext.totalHits",{n:0});
}
RELABEL.push(()=>{ if(EXT.blocks.length) extRender(); });
/* ---------------- events (capture phase first) ---------------- */
function extBlockAt(e){
  if(window.__layerLocks && window.__layerLocks.blocks) return null;
  for(const b of EXT.blocks) if(b.wrap.contains(e.target)) return b;
  return null;
}
function extLeaderAt(e){
  if(window.__layerLocks && window.__layerLocks.leaders) return null;
  /* screen -> map coords, then the leader whose label end is nearest
     within 24 units */
  const p=root.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
  const q=p.matrixTransform(mapInv);
  let best=null;
  for(const l of EXT.leaders){
    const x2=l.x20+l.dx, y2=l.y20+l.dy;
    const d=Math.hypot(q.x-x2, q.y-y2);
    if(d<24 && (!best||d<best.d)) best={l,d};
  }
  return best? best.l : null;
}
stage.addEventListener("mousedown", e=>{
  if(e.button!==0 || spaceDown) return;
  const b=extBlockAt(e);
  if(b){ if(sel){sel.el.classList.remove("dt-sel");sel=null;} EXT2.sel=null;EXT.sel=b; extPushUndo();
         const k=(b.inner? zoom*extMapScale() : zoom);
         EXT.drag={kind:"block", b, mx:e.clientX, my:e.clientY, dx0:b.dx, dy0:b.dy, k};
         e.stopPropagation(); e.preventDefault(); extRender(); return; }
  const l=extLeaderAt(e);
  if(l){ if(sel){sel.el.classList.remove("dt-sel");sel=null;} EXT2.sel=null;EXT.sel=l; extPushUndo();
         EXT.drag={kind:"ldr", l, mx:e.clientX, my:e.clientY, dx0:l.dx, dy0:l.dy, k:zoom*extMapScale()};
         e.stopPropagation(); e.preventDefault();
         setInfo(tHTML("ldr.info",{x:efmt(l.x20+l.dx), y:efmt(l.y20+l.dy)})); return; }
}, true);
function extMapScale(){
  const vb=(mapEl.getAttribute("viewBox")||"0 0 1684 1188").split(/\s+/).map(Number);
  const w=+mapEl.getAttribute("width")||1684, h=+mapEl.getAttribute("height")||1188;
  return Math.min(w/vb[2],h/vb[3]);
}
window.addEventListener("mousemove", e=>{
  const d=EXT.drag; if(!d) return;
  if(d.kind==="block"){
    d.b.dx=d.dx0+(e.clientX-d.mx)/d.k; d.b.dy=d.dy0+(e.clientY-d.my)/d.k;
    extPaint(d.b); extRender();
  }else{
    d.l.dx=d.dx0+(e.clientX-d.mx)/d.k; d.l.dy=d.dy0+(e.clientY-d.my)/d.k;
    extPaintLdr(d.l); extRender();
  }
}, true);
window.addEventListener("mouseup", ()=>{ if(EXT.drag){ EXT.drag=null; scheduleCount(); extRender(); } }, true);
window.addEventListener("keydown", e=>{
  if(e.target && e.target.closest && e.target.closest("input,textarea")) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && EXT.undo.length){ e.preventDefault(); extUndo(); e.stopPropagation(); return; }
  const b=EXT.sel; if(!b) return;
  if(b.wrap){                                   /* blocks: scale + arrows */
    if(e.key==="+"||e.key==="="){ e.preventDefault(); extPushUndo(); b.s*=1.02; extPaint(b); extRender(); e.stopPropagation(); }
    else if(e.key==="-"||e.key==="_"){ e.preventDefault(); extPushUndo(); b.s/=1.02; extPaint(b); extRender(); e.stopPropagation(); }
    else if(e.key.toLowerCase()==="r"){ e.preventDefault(); extPushUndo(); b.s=1; extPaint(b); extRender(); e.stopPropagation(); }
    else {
      const dd={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
      if(dd){ e.preventDefault(); extPushUndo(); const st=e.shiftKey?10:1;
              b.dx+=dd[0]*st; b.dy+=dd[1]*st; extPaint(b); extRender(); e.stopPropagation(); }
    }
  }else if(b.el){                               /* leaders: arrows only */
    const dd={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
    if(dd){ e.preventDefault(); extPushUndo(); const st=e.shiftKey?10:1;
            b.dx+=dd[0]*st; b.dy+=dd[1]*st; extPaintLdr(b); extRender(); e.stopPropagation(); }
  }
}, true);

/* ---------------- export: appended to the main move list ---------------- */
const _origExportText = exportText;
function extExportText(){
  const L=[_origExportText()];
  const bad=EXT.blocks.filter(b=>b.hits>0);
  L.push("");
  L.push("# ---- LAYOUT_NUDGE (block offsets; blocks inside the inner map are in map units,");
  L.push("#      blocks on the outer canvas are in canvas units) ----");
  if(bad.length) L.push("# !! still overlapping: "
    +bad.map(b=>tEnglish(b.labelKey)+"("+b.hits+")").join(", "));
  L.push("LAYOUT_NUDGE = {");
  for(const b of EXT.blocks) L.push('    '+py(b.id)+': ('+efmt(b.dx)+', '+efmt(b.dy)+'),   # '+tEnglish(b.labelKey)
    +(b.hits?'  <- overlaps '+b.hits:''));
  L.push("}");
  L.push("# ---- LAYOUT_SCALE (block scale factor, anchored at the block centre) ----");
  L.push("LAYOUT_SCALE = {");
  for(const b of EXT.blocks) if(Math.abs(b.s-1)>1e-6) L.push('    '+py(b.id)+': '+efmt(b.s*1000)/1000+',   # '+tEnglish(b.labelKey));
  L.push("}");
  const ld=EXT.leaders.filter(l=>l.dx||l.dy);
  L.push("# ---- LEADER_NUDGE (offset of the leader's *label* end, map units) ----");
  L.push("#      Identified by the station end (x1,y1): that end never moves and is unique.");
  L.push("LEADER_NUDGE = [");
  for(const l of ld) L.push('    (('+efmt(l.x1)+', '+efmt(l.y1)+'), '+efmt(l.dx)+', '+efmt(l.dy)+'),');
  if(!ld.length) L.push("    # (none)");
  L.push("]");
  return L.join("\n");
}
$("#btnExport").onclick = ()=>{ $("#exportText").value = extExportText(); $("#exportPane").style.display="block"; };
/* Filename carries a timestamp so an applier can always pick the newest
   export without any copy-paste step. */
function moveListName(){
  const d=new Date(), z=n=>String(n).padStart(2,"0");
  return "move-list_"+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())
        +"_"+z(d.getHours())+z(d.getMinutes())+".txt";
}
$("#btnDown").onclick = ()=>{
  const name=moveListName();
  const blob=new Blob([$("#exportText").value||extExportText()],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setInfo(tHTML("dl.done",{name}));
};

/* Scripting hooks (headless verification; same path as the mouse) */
window.moveBlock = (id,dx,dy)=>{ const b=EXT.blocks.find(x=>x.id===id); if(!b) throw new Error("No block with id "+id);
  extPushUndo(); b.dx+=dx; b.dy+=dy; extPaint(b); extRender(); return {id,dx:b.dx,dy:b.dy,hits:b.hits}; };
window.scaleBlock = (id,f)=>{ const b=EXT.blocks.find(x=>x.id===id); if(!b) throw new Error("No block with id "+id);
  extPushUndo(); b.s*=f; extPaint(b); extRender(); return {id,s:b.s,hits:b.hits}; };
window.moveLeader = (i,dx,dy)=>{ const l=EXT.leaders[i]; if(!l) throw new Error("No leader at index "+i);
  extPushUndo(); l.dx+=dx; l.dy+=dy; extPaintLdr(l); extRender();
  return {i, x2:efmt(l.x20+l.dx), y2:efmt(l.y20+l.dy)}; };
window.extState = ()=>({blocks:EXT.blocks.map(b=>({id:b.id,inner:b.inner,dx:efmt(b.dx),dy:efmt(b.dy),
  s:efmt(b.s*1000)/1000,hits:b.hits,box:extInnerBox(b)})),
  leaders:EXT.leaders.length, moved:EXT.leaders.filter(l=>l.dx||l.dy).length, text:extExportText()});

/* initialise once the main program is ready */
(function wait(){ if(window.__ready){ extBoot(); extRunTest(); } else setTimeout(wait,120); })();

/* ?exttest= has its own channel: document.title is already taken by the main
   program's ?test=, so results land in a hidden #extresult node instead. */
function extRunTest(){
  const raw = new URLSearchParams(location.search).get("exttest");
  if(!raw) return;
  const res={ops:[],errors:[]};
  try{
    for(const op of (JSON.parse(raw).ops||[])){
      try{
        if(op.k==="block")      res.ops.push(window.moveBlock(op.id, op.dx||0, op.dy||0));
        else if(op.k==="scale") res.ops.push(window.scaleBlock(op.id, op.f));
        else if(op.k==="ldr")   res.ops.push(window.moveLeader(op.i, op.dx||0, op.dy||0));
        else res.errors.push("unknown op: "+op.k);
      }catch(e){ res.errors.push(String(e.message||e)); }
    }
    res.state = window.extState();
  }catch(e){ res.errors.push("could not parse ?exttest= : "+String(e.message||e)); }
  const pre=document.createElement("pre"); pre.id="extresult";
  pre.textContent=JSON.stringify(res); pre.style.display="none";
  document.body.appendChild(pre);
}

<script>
"use strict";
/* =======================================================================
   Extension layer 2: everything about lines that do not exist yet.
     A. Proposal boxes — drag a "not to scale" box into place and export its
        anchor for your own data file.
     B. Eight-direction tracing — click vertices to draw a new line; every
        segment snaps to the nearest of eight directions and corners use the
        same rounding convention as the rest of the diagram (the Q control
        point *is* the corner, pulled back by CONFIG.schematic.setback).

   Design notes
     · Eight-direction geometry is guaranteed by construction, not repaired
       afterwards by a linter.
     · Colour, line name and status deliberately do NOT come from here. The
       trace is drawn in a neutral grey placeholder and the export says so —
       those belong to whatever data source owns your network.
   ======================================================================= */
const EXT2 = {schem:[], trace:null, lines:[], mode:null};
function schemLabel(sc){
  return sc.key || (t("type.schem")+" "+Math.round(sc.x0)+","+Math.round(sc.y0));
}
function schemMachineLabel(sc){
  return sc.key || (tEnglish("type.schem")+" "+Math.round(sc.x0)+","+Math.round(sc.y0));
}

/* ---------------- A. proposal boxes ---------------- */
function ext2FindSchem(){
  /* Proposal boxes have no dedicated id, so they are located by their marker
     text; the members that fall inside the box are then grouped so the whole
     thing drags as one. */
  const KEYS = CONFIG.schematic.keys;
  /* For each marker, take the **smallest rect containing it** — that is its
     box. Reasoning from "a big enough rect" instead is a trap: the drawing's
     full-canvas background rect also contains every marker, and swallows the
     entire map in one go. */
  const boxes=[]; const seen=new Set();
  for(const tx_el of mapEl.querySelectorAll("text")){
    if(!CONFIG.schematic.marker.test(tx_el.textContent)) continue;
    const tx=+tx_el.getAttribute("x"), ty=+tx_el.getAttribute("y");
    let best=null;
    for(const r of mapEl.querySelectorAll("rect")){
      const x=+r.getAttribute("x"), y=+r.getAttribute("y");
      const w=+r.getAttribute("width"), h=+r.getAttribute("height");
      if(!Number.isFinite(x)||!Number.isFinite(w)) continue;
      if(!(tx>=x-2 && tx<=x+w+2 && ty>=y-2 && ty<=y+h+2)) continue;
      if(!best || w*h < best.w*best.h) best={rect:r, x, y, w, h};
    }
    if(!best) continue;
    const sig=Math.round(best.x)+","+Math.round(best.y);
    if(seen.has(sig)) continue;
    seen.add(sig);
    best.key = KEYS[sig] || null;
    boxes.push(best);
  }
  for(const b of boxes){
    const wrap=document.createElementNS("http://www.w3.org/2000/svg","g");
    wrap.setAttribute("class","ext-schem");
    if(b.key) wrap.setAttribute("data-key", b.key);
    b.rect.parentNode.insertBefore(wrap, b.rect);
    const inside=(x,y)=> x>=b.x-2 && x<=b.x+b.w+2 && y>=b.y-2 && y<=b.y+b.h+2;
    const take=[];
    for(const el of [...mapEl.querySelectorAll("rect,text,line,circle,path")]){
      if(el.closest(".tlt-station") || el.classList.contains("tlt-label") ||
         el.closest(".tlt-code-group")) continue;
      if(el.closest("g.ext-schem") && el.closest("g.ext-schem")!==wrap) continue;
      const g=n=>parseFloat(el.getAttribute(n));
      let x,y;
      if(el.tagName==="line"){ x=g("x1"); y=g("y1"); }
      else if(el.tagName==="circle"){ x=g("cx"); y=g("cy"); }
      else if(el.tagName==="path"){ const bb=el.getBBox(); x=bb.x; y=bb.y; }
      else { x=g("x"); y=g("y"); }
      if(Number.isFinite(x) && inside(x,y)) take.push(el);
    }
    for(const el of take) wrap.appendChild(el);
    EXT2.schem.push({wrap, key:b.key, x0:b.x, y0:b.y, w:b.w, h:b.h, dx:0, dy:0,
                     n:take.length});
  }
}
function ext2PaintSchem(sc){ sc.wrap.setAttribute("transform","translate("+efmt(sc.dx)+","+efmt(sc.dy)+")"); }
function ext2SchemHits(sc){
  const B={x0:sc.x0+sc.dx, y0:sc.y0+sc.dy, x1:sc.x0+sc.w+sc.dx, y1:sc.y0+sc.h+sc.dy};
  let n=0; for(const o of extObstacles()) if(!(o.x1<B.x0||o.x0>B.x1||o.y1<B.y0||o.y0>B.y1)) n++;
  return n;
}

/* ---------------- B. eight-direction tracing ---------------- */
const EXT2_SETBACK = CONFIG.schematic.setback;   // same rounding as the artwork
function ext2Snap8(from, to){
  const dx=to.x-from.x, dy=to.y-from.y, L=Math.hypot(dx,dy);
  if(L<1e-6) return {x:from.x, y:from.y};
  let best=null;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, ux=Math.cos(a), uy=Math.sin(a);
    const proj=dx*ux+dy*uy;                    // projection onto that direction
    if(proj<=0) continue;
    const d=Math.abs(dx*uy-dy*ux);             // perpendicular distance = drift
    if(!best || d<best.d) best={d, x:from.x+ux*proj, y:from.y+uy*proj};
  }
  return best ? {x:Math.round(best.x*10)/10, y:Math.round(best.y*10)/10} : {x:from.x,y:from.y};
}
function ext2PathD(pts){
  /* Same corner convention as the artwork: L stops `setback` short of the
     corner, then Q uses the corner itself as its control point. */
  if(pts.length<2) return "";
  const P=pts, out=["M"+P[0].x+","+P[0].y];
  for(let i=1;i<P.length-1;i++){
    const a=P[i-1], c=P[i], b=P[i+1];
    const la=Math.hypot(c.x-a.x,c.y-a.y), lb=Math.hypot(b.x-c.x,b.y-c.y);
    const s=Math.min(EXT2_SETBACK, la/2, lb/2);
    const p1={x:c.x+(a.x-c.x)/la*s, y:c.y+(a.y-c.y)/la*s};
    const p2={x:c.x+(b.x-c.x)/lb*s, y:c.y+(b.y-c.y)/lb*s};
    out.push("L"+efmt(p1.x)+","+efmt(p1.y));
    out.push("Q"+efmt(c.x)+","+efmt(c.y)+" "+efmt(p2.x)+","+efmt(p2.y));
  }
  out.push("L"+P[P.length-1].x+","+P[P.length-1].y);
  return out.join(" ");
}
function ext2TraceStart(){
  if(window.__layerLocks && window.__layerLocks.newlines){
    setInfo(t("trace.locked"), true);
    return;
  }
  EXT2.mode="trace";
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","ext-trace");
  const cas=document.createElementNS("http://www.w3.org/2000/svg","path");
  cas.setAttribute("fill","none"); cas.setAttribute("stroke","#FBFAF7");
  cas.setAttribute("stroke-width","13"); cas.setAttribute("stroke-linejoin","round");
  const col=document.createElementNS("http://www.w3.org/2000/svg","path");
  col.setAttribute("fill","none"); col.setAttribute("stroke","#7a7a7a");   /* neutral placeholder: real colour is not this tool's business */
  col.setAttribute("stroke-width","7.7"); col.setAttribute("stroke-linejoin","round");
  col.setAttribute("stroke-dasharray","18 12");                            /* new lines default to a "planned" dash */
  g.appendChild(cas); g.appendChild(col); mapEl.appendChild(g);
  EXT2.trace={g, cas, col, pts:[]};
  setInfo(t("trace.start"));
  ext2Render();
}
function ext2TraceRepaint(){
  const tr=EXT2.trace; if(!tr) return;
  const d=ext2PathD(tr.pts);
  tr.cas.setAttribute("d", d); tr.col.setAttribute("d", d);
}
function ext2TraceFinish(keep){
  const tr=EXT2.trace; if(!tr) return;
  if(keep && tr.pts.length>=2){
    EXT2.lines.push({pts:tr.pts.slice(), d:ext2PathD(tr.pts), g:tr.g});
    setInfo(tHTML("trace.done",{n:tr.pts.length}));
  }else{
    tr.g.remove();
    setInfo(t(keep ? "trace.tooFew" : "trace.cancelled"));
  }
  EXT2.trace=null; EXT2.mode=null; ext2Render();
}

/* ---------------- events ---------------- */
stage.addEventListener("mousedown", e=>{
  if(e.button!==0 || spaceDown) return;
  if(EXT2.mode==="trace"){
    const p=root.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
    const q=p.matrixTransform(mapInv);
    const tr=EXT2.trace;
    const pt = tr.pts.length ? ext2Snap8(tr.pts[tr.pts.length-1], q)
                            : {x:Math.round(q.x*10)/10, y:Math.round(q.y*10)/10};
    tr.pts.push(pt); ext2TraceRepaint(); ext2Render();
    e.stopPropagation(); e.preventDefault(); return;
  }
  for(const sc of EXT2.schem){
    if(sc.wrap.contains(e.target)){
      if(sel){sel.el.classList.remove("dt-sel");sel=null;} EXT.sel=null;EXT2.sel=sc; extPushUndo();
      EXT2.drag={sc, mx:e.clientX, my:e.clientY, dx0:sc.dx, dy0:sc.dy, k:zoom*extMapScale()};
      e.stopPropagation(); e.preventDefault(); ext2Render(); return;
    }
  }
}, true);
window.addEventListener("mousemove", e=>{
  const d=EXT2.drag; if(!d) return;
  d.sc.dx=d.dx0+(e.clientX-d.mx)/d.k; d.sc.dy=d.dy0+(e.clientY-d.my)/d.k;
  ext2PaintSchem(d.sc); ext2Render();
}, true);
window.addEventListener("mouseup", ()=>{ if(EXT2.drag){ EXT2.drag=null; ext2Render(); } }, true);
window.addEventListener("keydown", e=>{
  if(e.target && e.target.closest && e.target.closest("input,textarea")) return;
  if(EXT2.mode==="trace"){
    if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); ext2TraceFinish(true); return; }
    if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); ext2TraceFinish(false); return; }
    if(e.key==="Backspace"){ e.preventDefault(); e.stopPropagation();
      EXT2.trace.pts.pop(); ext2TraceRepaint(); ext2Render(); return; }
    return;
  }
  if(e.key.toLowerCase()==="l" && !e.metaKey && !e.ctrlKey){
    e.preventDefault(); e.stopPropagation();
    if(window.__historyPush) window.__historyPush(t("hist.trace"));
    ext2TraceStart(); return;
  }
  const sc=EXT2.sel;
  if(sc && EXT2.schem.includes(sc)){
    const dd={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
    if(dd){ e.preventDefault(); e.stopPropagation(); extPushUndo();
            const st=e.shiftKey?10:1; sc.dx+=dd[0]*st; sc.dy+=dd[1]*st; ext2PaintSchem(sc); ext2Render(); }
  }
}, true);

/* ---------------- panel and export ---------------- */
function ext2Render(){
  const rows=EXT2.schem.map(sc=>{
    sc.hits=ext2SchemHits(sc);
    sc.wrap.style.outline = sc.hits? "3px dashed #b3261e" : "";
    const ax=efmt(sc.x0+sc.dx), ay=efmt(sc.y0+sc.dy);
    return '<tr class="'+(EXT2.sel===sc?"sel":"")+'"><td>'+escapeHTML(schemLabel(sc))+'</td>'
      +'<td class="n">'+ax+'</td><td class="n">'+ay+'</td>'
      +'<td class="'+(sc.hits?"err":"")+'">'+(sc.hits?t("ext.hit"):t("ext.ok"))+'</td></tr>';
  }).join("");
  const tr=EXT2.trace;
  $("#ext2Table").innerHTML =
    '<tr><td><b>'+t("ext2.schem")+'</b></td><td class="n">'+t("ext2.anchorX")+'</td><td class="n">y</td><td></td></tr>'+rows
    + '<tr><td colspan="4" style="padding-top:4px;color:#555">'+t("ext2.linesDrawn",{n:EXT2.lines.length})
    + (tr? '　<b>'+t("ext2.tracing",{n:tr.pts.length})+'</b>':'')+'</td></tr>';
}
const _extExport = extExportText;
function ext2ExportText(){
  const L=[_extExport()];
  L.push("");
  L.push("# ---- SCHEMATIC_ANCHOR (top-left corner of each proposal box, map units) ----");
  L.push("#      Keys come from CONFIG.schematic.keys and are what your own data file uses.");
  L.push("SCHEMATIC_ANCHOR = {");
  /* A box with no configured key has nowhere to be written back to. If it was
     moved anyway, say so explicitly rather than dropping the edit silently. */
  for(const sc of EXT2.schem){
    if(!sc.key && (sc.dx || sc.dy))
      L.push("#    !! "+schemMachineLabel(sc)+" was moved by ("+efmt(sc.dx)+","+efmt(sc.dy)+") but has no"
             +" key in CONFIG.schematic.keys — no applier can place it. Add a key or revert it.");
  }
  for(const sc of EXT2.schem){
    if(!sc.key) continue;
    if(!sc.dx && !sc.dy) continue;
    L.push('    '+py(sc.key)+': ('+efmt(sc.x0+sc.dx)+', '+efmt(sc.y0+sc.dy)+'),'
           +(sc.hits?'   # <- overlaps '+sc.hits:''));
  }
  L.push("}");
  L.push("# ---- NEW_LINE (traced vertices, eight-direction. Geometry only — colour,");
  L.push("#      line name and status belong to your own data source, not to this file) ----");
  L.push("NEW_LINE = [");
  for(const ln of EXT2.lines){
    L.push("    {");
    L.push('        "points": ['+ln.pts.map(p=>"("+efmt(p.x)+", "+efmt(p.y)+")").join(", ")+"],");
    L.push('        "d": "'+ln.d+'",');
    L.push('        "note": "vertices snapped to eight directions; corner setback '+EXT2_SETBACK+', same convention as the artwork",');
    L.push("    },");
  }
  if(!EXT2.lines.length) L.push("    # (none)");
  L.push("]");
  return L.join("\n");
}
$("#btnExport").onclick = ()=>{ $("#exportText").value = ext2ExportText(); $("#exportPane").style.display="block"; };
$("#btnDown").onclick = ()=>{
  const name=moveListName();
  const blob=new Blob([$("#exportText").value||ext2ExportText()],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setInfo(tHTML("dl.done",{name}));
};

/* Scripting hooks (headless verification) */
function moveSchemObject(sc,dx,dy){
  extPushUndo(); sc.dx+=dx; sc.dy+=dy; ext2PaintSchem(sc); ext2Render();
  return {key:sc.key,index:EXT2.schem.indexOf(sc),
    anchor:[efmt(sc.x0+sc.dx), efmt(sc.y0+sc.dy)], hits:sc.hits};
}
window.moveSchem = (key,dx,dy)=>{ const sc=EXT2.schem.find(x=>x.key===key); if(!sc) throw new Error("No proposal box with key "+key);
  return moveSchemObject(sc,dx,dy); };
window.moveSchemAt = (index,dx,dy)=>{ const sc=EXT2.schem[index]; if(!sc) throw new Error("No proposal box at index "+index);
  return moveSchemObject(sc,dx,dy); };
window.traceLine = (pts)=>{ if(window.__historyPush) window.__historyPush(t("hist.trace")); ext2TraceStart();
  for(const [x,y] of pts){
    const tr=EXT2.trace;
    const pt = tr.pts.length ? ext2Snap8(tr.pts[tr.pts.length-1], {x,y}) : {x,y};
    tr.pts.push(pt);
  }
  ext2TraceRepaint(); ext2TraceFinish(true);
  const ln=EXT2.lines[EXT2.lines.length-1];
  return {pts:ln.pts, d:ln.d}; };
window.ext2State = ()=>({schem:EXT2.schem.map(sc=>({key:sc.key,label:schemLabel(sc),members:sc.n,
  anchor:[efmt(sc.x0+sc.dx),efmt(sc.y0+sc.dy)],hits:sc.hits})), lines:EXT2.lines, text:ext2ExportText()});

(function w2(){ if(window.__ext){ ext2FindSchem(); ext2Render(); ext2RunTest(); } else setTimeout(w2,150); })();
function ext2RunTest(){
  const raw=new URLSearchParams(location.search).get("ext2test"); if(!raw) return;
  const res={ops:[],errors:[]};
  try{
    for(const op of (JSON.parse(raw).ops||[])){
      try{
        if(op.k==="schem") res.ops.push(window.moveSchem(op.key, op.dx||0, op.dy||0));
        else if(op.k==="schemIndex") res.ops.push(window.moveSchemAt(op.i, op.dx||0, op.dy||0));
        else if(op.k==="trace") res.ops.push(window.traceLine(op.pts));
        else res.errors.push("unknown op: "+op.k);
      }catch(e){ res.errors.push(String(e.message||e)); }
    }
    res.state=window.ext2State();
  }catch(e){ res.errors.push("could not parse ?ext2test= : "+String(e.message||e)); }
  const pre=document.createElement("pre"); pre.id="ext2result"; pre.style.display="none";
  pre.textContent=JSON.stringify(res); document.body.appendChild(pre);
}

</script>
<script>
"use strict";
/* =======================================================================
   Working layer: one history for every kind of edit, search, the selection
   inspector, layer locks, autosave/session files, export preflight and the
   accessibility wiring.

   It does not reimplement any geometry — every position change still goes
   through writeLabel / writeCode / extPaint above, so there is exactly one
   definition of what a move means.
   ======================================================================= */
(function(){
const UIH={undo:[],redo:[],applying:false,dirty:false,baseline:null,initialCounts:null,saveTimer:null};
const draftKey=()=>"rail-layout-draft:"+SOURCE_FINGERPRINT+":"+PANEL_FORMAT_VERSION;
window.__layerLocks={labels:false,codes:false,leaders:false,blocks:false,newlines:false};

function captureState(){
  return {
    format:PANEL_FORMAT_VERSION,source:SOURCE_FINGERPRINT,savedAt:new Date().toISOString(),
    labels:M.labels.map(L=>({x:L.x,y:L.y,anchor:L.anchor,rot:L.rot})),
    codes:M.codes.map(C=>({x:C.x,y:C.y,anchor:C.anchor,grabbed:!!C.grabbed})),
    blocks:(window.__ext?EXT.blocks:[]).map(b=>({id:b.id,dx:b.dx,dy:b.dy,s:b.s})),
    leaders:(window.__ext?EXT.leaders:[]).map(l=>({dx:l.dx,dy:l.dy})),
    schem:(typeof EXT2!=="undefined"?EXT2.schem:[]).map(sc=>({key:sc.key,x0:sc.x0,y0:sc.y0,dx:sc.dx,dy:sc.dy})),
    lines:(typeof EXT2!=="undefined"?EXT2.lines:[]).map(ln=>({pts:ln.pts.map(p=>({x:p.x,y:p.y}))}))
  };
}
function assertCompatible(s){
  if(!s||s.format!==PANEL_FORMAT_VERSION) throw new Error(t("session.formatMismatch",{v:PANEL_FORMAT_VERSION}));
  if(s.source!==SOURCE_FINGERPRINT) throw new Error(t("session.sourceMismatch"));
  if(!Array.isArray(s.labels)||s.labels.length!==M.labels.length) throw new Error(t("session.labelCount"));
  if(!Array.isArray(s.codes)||s.codes.length!==M.codes.length) throw new Error(t("session.codeCount"));
}
function restoreState(s){
  assertCompatible(s); UIH.applying=true;
  try{
    s.labels.forEach((r,i)=>{const L=M.labels[i];L.x=r.x;L.y=r.y;L.anchor=r.anchor;L.rot=r.rot;writeLabel(L);});
    s.codes.forEach((r,i)=>{const C=M.codes[i];C.x=r.x;C.y=r.y;C.anchor=r.anchor;C.grabbed=!!r.grabbed;writeCode(C);});
    for(const r of (s.blocks||[])){const b=EXT.blocks.find(x=>x.id===r.id);if(!b)continue;
      b.dx=r.dx;b.dy=r.dy;b.s=r.s;extPaint(b);}
    (s.leaders||[]).forEach((r,i)=>{const l=EXT.leaders[i];if(!l)return;l.dx=r.dx;l.dy=r.dy;extPaintLdr(l);});
    for(const r of (s.schem||[])){const sc=EXT2.schem.find(x=>(r.key&&x.key===r.key)||
      (!r.key&&((Number.isFinite(r.x0)&&Number.isFinite(r.y0)&&
                 Math.abs(x.x0-r.x0)<.01&&Math.abs(x.y0-r.y0)<.01)||
        [schemLabel(x),schemMachineLabel(x),I18N.zh["type.schem"]+" "+Math.round(x.x0)+","+Math.round(x.y0)]
          .includes(r.label))));
      if(!sc)continue;sc.dx=r.dx;sc.dy=r.dy;ext2PaintSchem(sc);}
    for(const ln of EXT2.lines){if(ln.g)ln.g.remove();}
    mapEl.querySelectorAll("g.ext-trace").forEach(g=>g.remove());
    EXT2.lines.length=0;EXT2.trace=null;EXT2.mode=null;
    const wasLock=window.__layerLocks.newlines;window.__layerLocks.newlines=false;
    for(const ln of (s.lines||[])){ext2TraceStart();if(!EXT2.trace)continue;
      EXT2.trace.pts=ln.pts.map(p=>({x:p.x,y:p.y}));ext2TraceRepaint();ext2TraceFinish(true);}
    window.__layerLocks.newlines=wasLock;
    EXT_OBS=null;vetoAll();recount();extRender();ext2Render();updateMovedCount();updateInspector();
  }finally{UIH.applying=false;}
}
function updateHistoryButtons(){
  $("#btnUndo").disabled=!UIH.undo.length;$("#btnRedo").disabled=!UIH.redo.length;
  $("#btnUndo").title=UIH.undo.length?t("hist.undoTip",{label:UIH.undo[UIH.undo.length-1].label}):t("hist.noUndo");
  $("#btnRedo").title=UIH.redo.length?t("hist.redoTip",{label:UIH.redo[UIH.redo.length-1].label}):t("hist.noRedo");
}
function historyPush(label){
  if(UIH.applying)return;
  UIH.undo.push({label:label||t("hist.generic"),state:captureState()});
  if(UIH.undo.length>200)UIH.undo.shift();
  UIH.redo.length=0;UIH.dirty=true;updateHistoryButtons();scheduleDraftSave();
}
function historyUndo(){
  const x=UIH.undo.pop();if(!x)return;
  UIH.redo.push({label:x.label,state:captureState()});restoreState(x.state);
  updateHistoryButtons();scheduleDraftSave();setInfo(tHTML("hist.undone",{label:x.label}));
}
function historyRedo(){
  const x=UIH.redo.pop();if(!x)return;
  UIH.undo.push({label:x.label,state:captureState()});restoreState(x.state);
  updateHistoryButtons();scheduleDraftSave();setInfo(tHTML("hist.redone",{label:x.label}));
}
window.__historyPush=historyPush;

/* Funnel the two separate undo stacks into one timeline. */
pushUndo=()=>historyPush(t(sel&&sel._kind==="code"?"hist.code":"hist.name"));
extPushUndo=()=>historyPush(t(EXT.sel&&EXT.sel.wrap?"hist.block":"hist.leader"));
window.undo=historyUndo;window.redo=historyRedo;

function updateInspector(){
  const row=(k,v)=>t(k)+": "+v;
  let body=t("inspector.empty");
  if(sel){
    if(sel._kind==="name")body=[
      row("insp.type",t("type.label")), row("insp.name",sel.text),
      row("insp.code",sel.st?sel.st.code:"—"),
      row("insp.offset","dx "+fmt(sel.x-sel.x0)+" / dy "+fmt(sel.y-sel.y0)),
      row("insp.anchor",sel.anchor),
      row("insp.angle",sel.hasRot?fmt(sel.rot)+"°":t("val.none")),
      row("insp.leader",sel.ldr?t("val.yes"):t("val.no")),
      row("insp.status",sel.veto?t("st.covered"):isMoved(sel)?t("st.modified"):t("st.original"))
    ].join("\n");
    else body=[
      row("insp.type",t("type.code")), row("insp.text",sel.text),
      row("insp.owner",sel.name),
      row("insp.quadrant",codeSlot(sel)+" ("+t("was",{v:sel.slot0})+")"),
      row("insp.status",sel.veto?t("st.covered"):sel.grabbed?t("st.modified"):t("st.original"))
    ].join("\n");
  }else if(EXT.sel){
    const b=EXT.sel;
    body=b.wrap?[
      row("insp.type",t("type.block")), row("insp.name",blockLabel(b)),
      row("insp.offset","dx "+efmt(b.dx)+" / dy "+efmt(b.dy)),
      row("insp.size",Math.round(b.s*100)+"%"),
      row("insp.status",b.hits?t("st.hits",{n:b.hits}):t("st.clear"))
    ].join("\n"):[
      row("insp.type",t("type.leader")),
      row("insp.endpoint","dx "+efmt(b.dx)+" / dy "+efmt(b.dy))
    ].join("\n");
  }else if(EXT2.sel){
    const sc=EXT2.sel;
    body=[row("insp.type",t("type.schem")), row("insp.name",schemLabel(sc)),
      row("insp.offset","dx "+efmt(sc.dx)+" / dy "+efmt(sc.dy)),
      row("insp.status",sc.hits?t("st.hits",{n:sc.hits}):t("st.clear"))].join("\n");
  }
  $("#inspectorBody").textContent=body;
}
RELABEL.push(updateInspector);
const baseSelect=select;
select=function(L,obj,kind){baseSelect(L,obj,kind);EXT.sel=null;EXT2.sel=null;updateInspector();};
stage.addEventListener("mouseup",()=>setTimeout(updateInspector,0));
window.addEventListener("keyup",()=>setTimeout(updateInspector,0));

function findStation(){
  const input=$("#stationSearch").value.trim(),raw=input.toLowerCase();if(!raw){setInfo(t("search.empty"),true);return;}
  const norm=s=>String(s||"").toLowerCase();
  const parts=input.split(/[|｜]/).map(s=>s.trim()).filter(Boolean);
  let L=null;
  if(parts.length>1){
    const qn=norm(parts[0]),qc=norm(parts[1]);
    L=M.labels.find(x=>x.st&&(norm(x.text)===qn||norm(x.st.name)===qn)&&
      M.codes.some(c=>norm(c.name)===norm(x.st.name)&&norm(c.text)===qc));
  }
  if(!L)L=M.labels.find(x=>x.st&&(norm(x.text)===raw||norm(x.st.name)===raw||norm(x.st.code)===raw));
  if(!L){
    const exactCodes=M.codes.filter(c=>norm(c.text)===raw);
    const names=[...new Set(exactCodes.map(c=>c.name))];
    if(names.length>1){
      const msg=tHTML("search.ambiguous",{code:input,n:names.length,names:names.join(", ")});
      $("#inspectorBody").textContent=t("search.results")+"\n"+names.map(n=>"• "+n+" | "+input).join("\n");
      setInfo(msg,true);return;
    }
    if(names.length===1)L=M.labels.find(x=>x.st&&(x.st.name===names[0]||x.text===names[0]));
  }
  if(!L)L=M.labels.find(x=>x.st&&(norm(x.text).includes(raw)||norm(x.st.name).includes(raw)||norm(x.st.code).includes(raw)));
  if(!L){setInfo(tHTML("search.notFound",{q:$("#stationSearch").value}),true);return;}
  focusOn(L.text+"|"+L.st.code,Math.max(5,zoom));select(L,L,"name");hot(L,L.code);
  $("#stationSearch").value=L.text+" | "+L.st.code;setInfo(tHTML("search.went",{name:L.text,code:L.st.code}));
}
function buildSearch(){
  const seen=new Set(),opts=[];
  for(const L of M.labels){if(!L.st)continue;const v=L.text+" | "+L.st.code;if(seen.has(v))continue;seen.add(v);opts.push("<option value=\""+v.replace(/"/g,"&quot;")+"\"></option>");}
  for(const C of M.codes){const v=C.name+" | "+C.text;if(seen.has(v))continue;seen.add(v);opts.push("<option value=\""+v.replace(/"/g,"&quot;")+"\"></option>");}
  $("#stationChoices").innerHTML=opts.join("");
}
$("#btnSearch").onclick=findStation;
$("#stationSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();findStation();}});

function applyLayerLocks(){
  host.classList.toggle("lock-labels",window.__layerLocks.labels);
  host.classList.toggle("lock-codes",window.__layerLocks.codes);
  $("#draftStatus").textContent=t("layer.updated");
}
for(const cb of document.querySelectorAll("[data-layer]"))cb.onchange=()=>{
  window.__layerLocks[cb.dataset.layer]=!cb.checked;applyLayerLocks();
};
stage.addEventListener("mousedown",e=>{
  if(window.__layerLocks.labels&&e.target.matches(".tlt-label")){e.stopPropagation();e.preventDefault();}
  if(window.__layerLocks.codes&&e.target.closest(".tlt-code-group")){e.stopPropagation();e.preventDefault();}
},true);

function draftAvailable(){
  try{return !!localStorage.getItem(draftKey());}catch(e){return false;}
}
function refreshDraftStatus(msg){
  $("#btnRestoreDraft").disabled=!draftAvailable();
  $("#btnClearDraft").disabled=!draftAvailable();
  $("#draftStatus").textContent=msg||t(draftAvailable()?"draft.found":"draft.none");
}
function saveDraft(){
  if(!UIH.dirty)return;
  try{localStorage.setItem(draftKey(),JSON.stringify(captureState()));UIH.dirty=false;
      refreshDraftStatus(t("draft.saved",{time:new Date().toLocaleTimeString(
        LANG==="zh"?"zh-Hant":"en",{hour:"2-digit",minute:"2-digit"})}));}
  catch(e){refreshDraftStatus(t("draft.failed",{msg:e.message}));}
}
function scheduleDraftSave(){if(!UIH.dirty)return;clearTimeout(UIH.saveTimer);UIH.saveTimer=setTimeout(saveDraft,350);}
$("#btnRestoreDraft").onclick=()=>{try{const s=JSON.parse(localStorage.getItem(draftKey())||"null");historyPush(t("hist.beforeDraft"));restoreState(s);UIH.dirty=true;scheduleDraftSave();setInfo(tHTML("draft.restored"));}catch(e){setInfo(tHTML("draft.restoreFail",{msg:e.message}),true);}};
$("#btnClearDraft").onclick=()=>{try{localStorage.removeItem(draftKey());}catch(e){}UIH.dirty=false;refreshDraftStatus(t("draft.cleared"));};
$("#btnSaveSession").onclick=()=>{
  const blob=new Blob([JSON.stringify(captureState(),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="layout-session_"+stamp()+".json";
  document.body.appendChild(a);a.click();a.remove();setInfo(t("session.saved"));
};
$("#btnLoadSession").onclick=()=>$("#sessionFile").click();
$("#sessionFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const s=JSON.parse(await f.text());historyPush(t("hist.beforeSession"));restoreState(s);saveDraft();setInfo(tHTML("session.loaded",{name:f.name}));}
  catch(err){setInfo(tHTML("session.loadFail",{msg:err.message}),true);}finally{e.target.value="";}};
window.addEventListener("mouseup",scheduleDraftSave);
window.addEventListener("keyup",e=>{if(!["Control","Meta","Shift","Alt"].includes(e.key))scheduleDraftSave();});
window.addEventListener("beforeunload",saveDraft);

function movedSummary(){
  const R=exportRows(),blocks=EXT.blocks.filter(b=>b.dx||b.dy||Math.abs(b.s-1)>1e-6);
  const leaders=EXT.leaders.filter(l=>l.dx||l.dy),schem=EXT2.schem.filter(sc=>sc.dx||sc.dy);
  const hard=[...R.warnUI];
  for(const b of blocks)if(b.hits)hard.push(tHTML("warn.blockHits",{label:blockLabel(b),n:b.hits}));
  for(const sc of schem){if(sc.hits)hard.push(tHTML("warn.blockHits",{label:schemLabel(sc),n:sc.hits}));
                         if(!sc.key)hard.push(tHTML("warn.schemNoKey",{label:schemLabel(sc)}));}
  if(UIH.initialCounts&&window.__counts&&window.__counts.nr>UIH.initialCounts.nr)
    hard.push(t("warn.moreCrossings",{n:window.__counts.nr-UIH.initialCounts.nr}));
  return {R,blocks,leaders,schem,hard,text:t("pre.summary",{
    names:R.nameRows.length, codes:R.codeRows.length, angles:R.angleRows.length,
    blocks:blocks.length, leaders:leaders.length, schem:schem.length,
    lines:EXT2.lines.length})};
}
function openPreflight(){
  EXT_OBS=null;recount();extRender();ext2Render();
  const p=movedSummary();$("#exportText").value=ext2ExportText();
  $("#exportSummary").className=p.hard.length?"bad":"";
  $("#exportSummary").innerHTML=(p.hard.length
      ? "<span class=\"state-symbol\">⚠</span>"+t("pre.fail")+" "+p.hard.join("; ")
      : "<span class=\"state-symbol\">✓</span>"+t("pre.pass"))
    + "<br>"+p.text
    + "<br>"+t("pre.fingerprint",{fp:SOURCE_FINGERPRINT.slice(0,12),v:PANEL_FORMAT_VERSION});
  $("#btnDown").disabled=!!p.hard.length;$("#exportPane").style.display="flex";$("#btnCloseExp").focus();
}
$("#btnExport").onclick=openPreflight;

function runUITest(){
  const raw=qs.get("uitest");if(!raw)return;
  const spec=raw==="1"?{ops:[
    {t:"search",q:"B03"},{t:"name",key:"Cathedral|R06",dx:0,dy:2},
    {t:"block",id:"title-block",dx:2,dy:0},{t:"undo"},{t:"undo"},{t:"redo"},
    {t:"layer",name:"codes",locked:true},{t:"preflight"},{t:"draft"}
  ]}:JSON.parse(raw);
  const res={ops:[],errors:[]};
  try{
    for(const op of (spec.ops||[])){
      try{
        if(op.t==="search"){$("#stationSearch").value=op.q;findStation();res.ops.push({search:op.q,selected:sel&&sel.st?sel.st.code:null});}
        else if(op.t==="name")res.ops.push({name:op.key,result:window.applyMove(op.key,op.dx||0,op.dy||0)});
        else if(op.t==="block")res.ops.push({block:op.id,result:window.moveBlock(op.id,op.dx||0,op.dy||0)});
        else if(op.t==="undo"){historyUndo();res.ops.push({undo:true});}
        else if(op.t==="redo"){historyRedo();res.ops.push({redo:true});}
        else if(op.t==="layer"){window.__layerLocks[op.name]=!!op.locked;applyLayerLocks();res.ops.push({layer:op.name,locked:!!op.locked});}
        else if(op.t==="preflight"){openPreflight();res.ops.push({preflight:$("#exportSummary").textContent,downloadDisabled:$("#btnDown").disabled});}
        else if(op.t==="draft"){saveDraft();res.ops.push({draft:draftAvailable()});}
        else if(op.t==="restoreDraft"){$("#btnRestoreDraft").onclick();
          res.ops.push({restoreDraft:true,movedNames:M.labels.filter(isMoved).length});}
        else if(op.t==="reset"){window.resetAll();
          res.ops.push({reset:true,movedNames:M.labels.filter(isMoved).length});}
      }catch(e){res.errors.push(String(e.message||e));}
    }
    const L=M.byKey.get("Cathedral|R06"),B=EXT.blocks.find(x=>x.id==="title-block");
    /* Read every token declared by either theme, not a hand-picked sample. */
    const cs=getComputedStyle(document.documentElement), tokens={};
    const tokenNames=new Set();
    const collect=rules=>{for(const rule of rules){
      if(rule.selectorText&&rule.selectorText.includes(":root")&&rule.style)
        for(const k of rule.style)if(k.startsWith("--"))tokenNames.add(k);
      if(rule.cssRules)collect(rule.cssRules);
    }};
    for(const sheet of document.styleSheets)collect(sheet.cssRules);
    for(const k of tokenNames)tokens[k]=cs.getPropertyValue(k);
    const svgEl=host.querySelector("svg");
    const dockRect=$("#rightDock").getBoundingClientRect(),mapRect=svgEl.getBoundingClientRect();
    const mapDockOverlap=!(mapRect.right<=dockRect.left||dockRect.right<=mapRect.left||
                           mapRect.bottom<=dockRect.top||dockRect.bottom<=mapRect.top);
    const missingI18n=[...document.querySelectorAll("[data-i18n]")]
      .filter(el=>el.textContent.trim()===el.getAttribute("data-i18n")).map(el=>el.getAttribute("data-i18n"));
    res.state={labelMoved:L?isMoved(L):null,blockDx:B?B.dx:null,undo:UIH.undo.length,redo:UIH.redo.length,
      inspector:$("#inspectorBody").textContent,source:SOURCE_FINGERPRINT,format:PANEL_FORMAT_VERSION,
      dockChildren:[...$("#rightDock").children].map(x=>x.id),downloadDisabled:$("#btnDown").disabled,
      theme:document.documentElement.getAttribute("data-theme"),tokens:tokens,
      paper:svgEl?getComputedStyle(svgEl).backgroundColor:null,draft:draftAvailable(),
      renderedStyles:{page:getComputedStyle(document.body).backgroundImage,
        pane:getComputedStyle($("#topbar")).backgroundImage,
        button:getComputedStyle($("#btnExport")).backgroundImage,
        buttonTransition:getComputedStyle($("#btnExport")).transitionDuration,
        dockRadius:getComputedStyle($("#rightDock")).borderRadius,
        table:getComputedStyle($("#counts td")).color},
      movedNames:M.labels.filter(isMoved).length,movedCodes:M.codes.filter(c=>c.grabbed).length,
      missingI18n,infoHTML:$("#info").innerHTML,probeExists:!!$("#xss-probe"),mapDockOverlap,
      sanitized:SANITIZED_ITEMS,unsafeProbe:globalThis.__unsafeProbe||0,
      exportText:ext2ExportText(),mapRect:{left:mapRect.left,top:mapRect.top,right:mapRect.right,bottom:mapRect.bottom},
      dockRect:{left:dockRect.left,top:dockRect.top,right:dockRect.right,bottom:dockRect.bottom},
      semanticClasses:{stations:host.querySelectorAll(".tlt-station").length,
        labels:host.querySelectorAll(".tlt-label").length,codes:host.querySelectorAll(".tlt-code-group").length},
      codePointer:getComputedStyle(host.querySelector(".tlt-code-group text")).pointerEvents};
  }catch(e){res.errors.push("uitest："+String(e.message||e));}
  const pre=document.createElement("pre");pre.id="uitestresult";pre.textContent=JSON.stringify(res);pre.style.display="none";
  document.body.appendChild(pre);
}

$("#btnUndo").onclick=historyUndo;$("#btnRedo").onclick=historyRedo;
window.addEventListener("keydown",e=>{
  if(e.target && e.target.closest && e.target.closest("input,textarea")) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
    e.preventDefault();e.stopImmediatePropagation();e.shiftKey?historyRedo():historyUndo();
  }else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){
    e.preventDefault();e.stopImmediatePropagation();historyRedo();
  }
},true);

/* Reset means every layer returns to the boot baseline, not just names. */
window.resetAll=()=>{historyPush(t("hist.reset"));restoreState(UIH.baseline);setInfo(t("reset.done"));};
$("#btnReset").onclick=window.resetAll;

function showSanitizeNotice(){
  if(SANITIZED_ITEMS)
    setInfo(tHTML("info.hover")+"<br>"+tHTML("boot.sanitized",{n:SANITIZED_ITEMS}),true);
}
RELABEL.push(showSanitizeNotice);

function initMaturity(){
  if(!window.__ready||!window.__ext||typeof EXT2==="undefined"){setTimeout(initMaturity,120);return;}
  for(const id of ["ext2Pane","extPane"]){const el=$("#"+id);if(el)$("#rightDock").appendChild(el);}
  /* Appending the extension panes can make the bottom dock grow upward at the
     responsive breakpoint. Refit against its final rectangle, not the
     smaller boot-time dock. */
  fitAll();
  applyStaticI18n();   /* these panes live after script 1, so translate them now */
  showSanitizeNotice();
  buildSearch();recount();UIH.initialCounts=Object.assign({},window.__counts);
  UIH.baseline=captureState();updateHistoryButtons();updateInspector();refreshDraftStatus();
  window.__maturity={captureState,restoreState,historyPush,historyUndo,historyRedo,movedSummary,
    source:SOURCE_FINGERPRINT,format:PANEL_FORMAT_VERSION};
  runUITest();
}
initMaturity();
})();
