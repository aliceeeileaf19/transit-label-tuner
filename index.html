<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A reproducible last-mile label editor for generated transit diagrams.">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Transit Label Tuner</title>
<style>
  /* ===================================================================
     Theming
     -------------------------------------------------------------------
     Two themes, one set of rules. Everything that differs between them is
     a semantic custom property declared in the blocks below; the rules
     that follow never name a raw colour except where it belongs to the
     artwork rather than the interface.

     The map itself stays on light paper in both themes — it is the
     document being edited, not part of the chrome. For the same reason the
     drag-state colours (.dt-*) are drawn on that paper and do not change.

     Default follows the operating system; an explicit choice is stored in
     localStorage and wins, and ?theme=dark|light overrides both.
     =================================================================== */

  :root, :root[data-theme="light"]{
    color-scheme:light;
    --gap:18px;
    --text:#141718; --muted:#717778;
    --line:rgba(16,20,21,.10); --line-hot:rgba(16,20,21,.30);
    --accent:#b8d900; --accent-deep:#8ba400; --accent-soft:rgba(184,217,0,.14);
    --danger:#b54440; --danger-soft:#a23f3a;
    --shadow:0 18px 48px rgba(28,34,35,.13),0 3px 10px rgba(28,34,35,.06);
    --inner:inset 0 1px 0 rgba(255,255,255,.94);

    --page-bg:
      radial-gradient(circle at 43% 20%,rgba(255,255,255,.98),rgba(245,247,246,.84) 34%,transparent 64%),
      linear-gradient(145deg,#d5d8d9 0%,#eef0ef 42%,#cfd3d4 100%);
    --page-bg-size:auto;
    --veil:linear-gradient(180deg,rgba(255,255,255,.72),transparent 20%,transparent 78%,rgba(90,97,99,.10));
    --veil-shadow:inset 0 0 120px rgba(83,90,92,.10);
    --veil-opacity:.62;
    --seam:none;
    --host-shadow:0 0 0 1px rgba(25,30,31,.07),0 24px 70px rgba(37,43,44,.16);

    --pane-bg:rgba(250,251,250,.90);
    --pane-border:1px solid rgba(18,22,23,.09);
    --pane-radius:17px;
    --pane-blur:blur(13px) saturate(108%);
    --pane-sheen:linear-gradient(125deg,rgba(255,255,255,.68),transparent 38%,rgba(255,255,255,.18));

    --topbar-bg:rgba(249,250,249,.92);
    --topbar-border:1px solid rgba(20,24,25,.10);
    --topbar-border-left:1px solid rgba(20,24,25,.10);
    --topbar-mark:"LAYOUT / 01";
    --topbar-mark-fg:rgba(20,24,25,.28);
    --topbar-mark-track:.15em;
    --topbar-mark-inset-r:16px; --topbar-mark-inset-b:11px;
    --topbar-pad:16px 17px 15px; --topbar-w:476px;

    --eyebrow-fg:#747a7b; --eyebrow-size:8px; --eyebrow-weight:750; --eyebrow-track:.18em;
    --title-size:17px; --title-weight:650; --title-track:-.01em; --title-shadow:none;
    --srcname-fg:#818687;

    --badge-bg:rgba(255,255,255,.64); --badge-border:1px solid rgba(20,24,25,.10);
    --badge-fg:#4f5556; --badge-radius:99px; --badge-pad:5px 9px; --badge-track:.12em;
    --badge-dot:inline-block;

    --hint-fg:#656b6c; --strip-rule:rgba(20,24,25,.08); --strip-fg:#777d7e;
    --key-bg:rgba(255,255,255,.72); --key-border:rgba(20,24,25,.10);
    --key-radius:7px; --key-shadow:none; --key-fg:#343839;
    --moved-fg:#6f7576;

    --btn-bg:rgba(255,255,255,.72); --btn-fg:#25292a;
    --btn-border:rgba(20,24,25,.10); --btn-radius:9px;
    --btn-shadow:0 2px 6px rgba(27,32,33,.04); --btn-weight:560;
    --btn-h:31px; --btn-pad:5px 11px;
    --btn-hover-bg:#fff; --btn-hover-border:rgba(20,24,25,.25);
    --btn-hover-shadow:0 7px 15px rgba(27,32,33,.09);
    --btn-press:scale(.985);
    --btn-transition:.14s;
    --pri-bg:#111415; --pri-fg:#fff; --pri-border:#111415;
    --pri-shadow:0 7px 16px rgba(17,20,21,.16);
    --pri-hover-bg:#25292a; --pri-hover-border:#25292a;
    --btn-danger-fg:#a23f3a;
    --focus-ring:3px solid rgba(184,217,0,.50); --focus-offset:2px;
    --btn-disabled:.38;

    --boot-bg:radial-gradient(circle at 50% 40%,#fdfefd,#e0e3e3 68%);
    --boot-fg:#666c6d; --boot-b-fg:#151819; --boot-b-size:14px; --boot-b-weight:650;
    --boot-small-fg:#777d7e; --boot-dot-shadow:0 0 0 5px rgba(184,217,0,.14);

    --dock-bg:rgba(249,250,249,.92); --dock-radius:18px;
    --dock-border:1px solid rgba(20,24,25,.10);
    --dock-border-right:1px solid rgba(20,24,25,.10);
    --dock-shadow:var(--shadow),var(--inner);
    --dock-pad:5px 0; --dock-w:352px;
    --dock-rule:rgba(20,24,25,.08);
    --dock-head-fg:#858a8b; --dock-head-size:8px; --dock-head-track:.15em;
    --dock-head-pad:9px 15px 10px;
    --dock-pane-pad:13px 15px;
    --dock-b-fg:#25292a; --dock-b-size:11.5px; --dock-b-weight:650;
    --dock-blur:blur(13px) saturate(108%);
    --dock-item-rule:rgba(20,24,25,.08); --dock-arrow-fg:#8ba400;
    --scroll-thumb:rgba(30,35,36,.18); --scroll-color:rgba(30,35,36,.18);

    --input-bg:rgba(255,255,255,.78); --input-border:rgba(20,24,25,.11);
    --input-radius:9px; --input-fg:#151819;
    --input-shadow:inset 0 1px 2px rgba(24,28,29,.04); --ph-fg:#999e9f;

    --chip-bg:rgba(255,255,255,.48); --chip-border:rgba(20,24,25,.09);
    --chip-fg:#656b6c; --chip-radius:8px;
    --chip-on-bg:#fff; --chip-on-border:rgba(20,24,25,.20); --chip-on-fg:#171a1b;
    --check-accent:#111415;

    --draft-fg:#777d7e;
    --insp-bg:rgba(255,255,255,.52); --insp-rule:#b8d900;
    --insp-fg:#596061; --insp-radius:2px;
    --table-fg:#555b5c; --warn-fg:#b54440; --warn-shadow:none;
    --sel-row-bg:rgba(184,217,0,.15);

    --info-bg:rgba(249,250,249,.94); --info-border:1px solid rgba(20,24,25,.09);
    --info-rule:3px solid #b8d900; --info-fg:#565c5d; --info-radius:12px;
    --info-pad:8px 13px 8px 18px;

    --export-bg:rgba(250,251,250,.98);
    --ta-bg:#f3f4f3; --ta-border:rgba(20,24,25,.11); --ta-fg:#25292a; --ta-radius:11px;
    --ok-bg:rgba(184,217,0,.11); --ok-border:rgba(125,151,0,.18); --ok-fg:#586600;
    --bad-bg:rgba(181,68,64,.08); --bad-border:rgba(181,68,64,.20); --bad-fg:#a23f3a;
    --err-fg:#b54440; --err-weight:700;
  }

  :root[data-theme="dark"]{
    color-scheme:dark;
    --gap:16px;
    --text:#e9f7ff; --muted:#88a8ba;
    --line:rgba(131,211,244,.2); --line-hot:rgba(126,224,255,.58);
    --accent:#64c9ff; --accent-deep:#51e3d4; --accent-soft:rgba(100,201,255,.18);
    --danger:#ff9a9e; --danger-soft:#ffb0b3;
    --shadow:0 22px 54px rgba(0,0,0,.42),0 8px 22px rgba(0,0,0,.28);
    --inner:inset 0 1px 0 rgba(203,241,255,.1),inset 0 -1px 0 rgba(0,0,0,.28);

    --page-bg:
      linear-gradient(rgba(95,197,235,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(95,197,235,.022) 1px,transparent 1px),
      radial-gradient(circle at 51% 30%,rgba(28,104,142,.24),transparent 45%),
      linear-gradient(145deg,#0a2637,#02070c 70%);
    --page-bg-size:36px 36px,36px 36px,auto,auto;
    --veil:linear-gradient(180deg,rgba(72,185,225,.07),transparent 12%,transparent 86%,rgba(4,13,22,.72));
    --veil-shadow:inset 0 0 100px rgba(0,0,0,.42);
    --veil-opacity:.72;
    --seam:block;
    --host-shadow:0 0 0 1px rgba(147,224,250,.17),0 28px 80px rgba(0,0,0,.5),0 0 48px rgba(74,183,222,.08);

    --pane-bg:linear-gradient(155deg,rgba(10,39,55,.9),rgba(5,20,31,.86));
    --pane-border:1px solid var(--line);
    --pane-radius:8px;
    --pane-blur:blur(18px) saturate(128%);
    --pane-sheen:linear-gradient(115deg,rgba(191,239,255,.09),transparent 20%,transparent 78%,rgba(72,194,239,.045));

    --topbar-bg:linear-gradient(110deg,rgba(7,30,45,.96),rgba(5,18,29,.88));
    --topbar-border:1px solid rgba(119,215,249,.27);
    --topbar-border-left:2px solid rgba(100,210,248,.76);
    --topbar-mark:"COMMAND / 01";
    --topbar-mark-fg:rgba(124,207,238,.32);
    --topbar-mark-track:.16em;
    --topbar-mark-inset-r:14px; --topbar-mark-inset-b:9px;
    --topbar-pad:14px 16px 13px; --topbar-w:468px;

    --eyebrow-fg:#73d6ff; --eyebrow-size:8.5px; --eyebrow-weight:800; --eyebrow-track:.2em;
    --title-size:16px; --title-weight:700; --title-track:.025em;
    --title-shadow:0 0 18px rgba(90,204,255,.16);
    --srcname-fg:var(--muted);

    --badge-bg:rgba(81,227,212,.07); --badge-border:1px solid rgba(81,227,212,.3);
    --badge-fg:#7ef2e3; --badge-radius:3px; --badge-pad:4px 8px; --badge-track:.16em;
    --badge-dot:none;

    --hint-fg:#c8d6e8; --strip-rule:rgba(117,210,244,.12); --strip-fg:var(--muted);
    --key-bg:rgba(105,205,241,.06); --key-border:rgba(126,215,247,.18);
    --key-radius:3px; --key-shadow:inset 0 1px 0 rgba(255,255,255,.08); --key-fg:#dceaff;
    --moved-fg:#a9bad0;

    --btn-bg:linear-gradient(180deg,rgba(111,207,244,.1),rgba(60,126,157,.04));
    --btn-fg:#e7f7ff; --btn-border:rgba(125,211,243,.18); --btn-radius:4px;
    --btn-shadow:inset 0 1px 0 rgba(211,244,255,.07),0 4px 12px rgba(0,0,0,.15);
    --btn-weight:400; --btn-h:30px; --btn-pad:5px 10px;
    --btn-hover-bg:rgba(114,169,238,.18); --btn-hover-border:var(--line-hot);
    --btn-hover-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 7px 18px rgba(0,0,0,.18);
    --btn-press:scale(.98);
    --btn-transition:.16s;
    --pri-bg:linear-gradient(135deg,rgba(33,135,184,.92),rgba(47,106,159,.92));
    --pri-fg:#e7f7ff; --pri-border:rgba(100,201,255,.58);
    --pri-shadow:inset 0 1px 0 rgba(210,244,255,.17),0 0 18px rgba(65,188,235,.14);
    --pri-hover-bg:rgba(46,155,205,.95); --pri-hover-border:rgba(140,220,255,.7);
    --btn-danger-fg:#ffb0b3;
    --focus-ring:3px solid rgba(99,167,255,.8); --focus-offset:3px;
    --btn-disabled:.45;

    --boot-bg:radial-gradient(circle at 50% 42%,#142b4e,#050a13 62%);
    --boot-fg:#a9c8ee; --boot-b-fg:#dff6ff; --boot-b-size:13px; --boot-b-weight:700;
    --boot-small-fg:#7fa3b8; --boot-dot-shadow:0 0 18px var(--accent);

    --dock-bg:linear-gradient(170deg,rgba(7,30,45,.94),rgba(3,15,25,.93));
    --dock-radius:8px;
    --dock-border:1px solid rgba(126,215,247,.22);
    --dock-border-right:2px solid rgba(100,210,248,.52);
    --dock-shadow:var(--shadow),inset 0 1px 0 rgba(205,241,255,.07);
    --dock-pad:4px 0; --dock-w:348px;
    --dock-rule:rgba(117,210,244,.13);
    --dock-head-fg:rgba(118,210,244,.55); --dock-head-size:8px; --dock-head-track:.17em;
    --dock-head-pad:7px 13px 8px;
    --dock-pane-pad:12px 14px;
    --dock-b-fg:#eef6ff; --dock-b-size:11px; --dock-b-weight:750;
    --dock-blur:blur(18px) saturate(125%);
    --dock-item-rule:rgba(117,210,244,.12); --dock-arrow-fg:#64c9ff;
    --scroll-thumb:rgba(145,190,245,.28); --scroll-color:rgba(105,205,241,.24);

    --input-bg:rgba(1,10,17,.58); --input-border:rgba(117,210,244,.18);
    --input-radius:4px; --input-fg:var(--text);
    --input-shadow:inset 0 1px 7px rgba(0,0,0,.24); --ph-fg:#71849d;

    --chip-bg:rgba(2,12,20,.26); --chip-border:rgba(117,210,244,.12);
    --chip-fg:#8da9b8; --chip-radius:3px;
    --chip-on-bg:rgba(79,137,225,.15); --chip-on-border:rgba(99,167,255,.34); --chip-on-fg:#e9f4ff;
    --check-accent:var(--accent);

    --draft-fg:#8fa5be;
    --insp-bg:rgba(1,10,17,.43); --insp-rule:rgba(100,201,255,.35);
    --insp-fg:#aac4d2; --insp-radius:2px;
    --table-fg:#b6c6d9; --warn-fg:#ff9a9e; --warn-shadow:0 0 16px rgba(255,80,90,.35);
    --sel-row-bg:rgba(99,167,255,.17);

    --info-bg:rgba(3,17,27,.92); --info-border:0;
    --info-rule:2px solid rgba(81,227,212,.72); --info-fg:#bad1de; --info-radius:5px;
    --info-pad:8px 13px 8px 18px;

    --export-bg:rgba(3,15,25,.94);
    --ta-bg:rgba(2,8,18,.66); --ta-border:var(--line); --ta-fg:#d9e7f8; --ta-radius:12px;
    --ok-bg:rgba(85,230,210,.08); --ok-border:rgba(85,230,210,.18); --ok-fg:#a9ecdf;
    --bad-bg:rgba(255,88,96,.09); --bad-border:rgba(255,126,131,.22); --bad-fg:#ffadb0;
    --err-fg:#ff999e; --err-weight:800;
  }

  /* =================== structure (theme-independent) =================== */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;
    font-family:'Noto Sans TC','PingFang TC',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--page-bg);background-size:var(--page-bg-size);
    color:var(--text);overflow:hidden}
  body:before,body:after{content:"";position:fixed;pointer-events:none}
  body:before{inset:0;opacity:var(--veil-opacity);background:var(--veil);box-shadow:var(--veil-shadow)}
  body:after{display:var(--seam);opacity:.72;left:50%;top:0;width:1px;height:100%;
    background:linear-gradient(transparent,rgba(98,211,250,.12),transparent);
    box-shadow:0 0 42px rgba(79,190,232,.18)}
  #stage{position:absolute;inset:0;overflow:hidden;cursor:grab}
  #stage.panning{cursor:grabbing}
  #host{position:absolute;left:0;top:0;transform-origin:0 0}
  /* The artwork keeps its own paper in both themes — it is the document. */
  #host>svg{display:block;background:#fbfaf6;box-shadow:var(--host-shadow)}

  /* Interaction states are class-only — never a geometry attribute — and are
     drawn on the artwork, so they stay constant across themes. */
  .tlt-label,.tlt-code-group text{cursor:move}
  .tlt-label:focus-visible{outline:2px solid #0a58ca;outline-offset:3px}
  .dt-hot{fill:#0a58ca !important}
  .dt-hot-ldr{stroke:#0a58ca !important;stroke-width:1.6 !important}
  .dt-sel{fill:#b8860b !important}
  .dt-moved{fill:#0f7b3f !important}
  .dt-veto{fill:#d40000 !important}
  .dt-ring{fill:none;stroke:#0a58ca;stroke-width:1.2;pointer-events:none}
  .dt-vetobox{fill:none;stroke:#d40000;stroke-width:1.6;pointer-events:none}

  .pane{position:absolute;background:var(--pane-bg);border:var(--pane-border);
    border-radius:var(--pane-radius);box-shadow:var(--shadow),var(--inner);
    -webkit-backdrop-filter:var(--pane-blur);backdrop-filter:var(--pane-blur);
    font-size:12px;line-height:1.5;color:var(--text)}
  .pane:before{content:"";position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;background:var(--pane-sheen)}
  .pane>*{position:relative}

  #topbar{top:var(--gap);left:var(--gap);padding:var(--topbar-pad);width:var(--topbar-w);
    max-width:calc(100vw - 402px);border:var(--topbar-border);
    border-left:var(--topbar-border-left);background:var(--topbar-bg)}
  #topbar:after{content:var(--topbar-mark);position:absolute;
    right:var(--topbar-mark-inset-r);bottom:var(--topbar-mark-inset-b);
    color:var(--topbar-mark-fg);font:700 8px ui-monospace,SFMono-Regular,monospace;
    letter-spacing:var(--topbar-mark-track)}
  .brandRow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px}
  .brandCopy{min-width:0}
  .eyebrow{display:block;margin-bottom:3px;color:var(--eyebrow-fg);font-size:var(--eyebrow-size);
    font-weight:var(--eyebrow-weight);letter-spacing:var(--eyebrow-track)}
  #topbar b{display:block;font-size:var(--title-size);font-weight:var(--title-weight);
    line-height:1.25;letter-spacing:var(--title-track);text-shadow:var(--title-shadow)}
  #srcName{display:block;margin-top:2px;color:var(--srcname-fg);font-size:10.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .offlineBadge{flex:0 0 auto;padding:var(--badge-pad);border:var(--badge-border);
    border-radius:var(--badge-radius);background:var(--badge-bg);color:var(--badge-fg);
    font-size:8px;font-weight:800;letter-spacing:var(--badge-track)}
  .offlineBadge:before{content:"";display:var(--badge-dot);width:6px;height:6px;margin-right:6px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);vertical-align:-1px}
  .quickHint{margin:0 0 9px;color:var(--hint-fg);font-size:11px}
  .actionRow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .actionRow+.actionRow{margin-top:6px}
  .actionRow .spacer{flex:1}
  /* padding-right keeps the last shortcut clear of the corner mark, which is
     absolutely positioned in the same bottom-right corner. */
  .shortcutStrip{display:flex;gap:5px;overflow:hidden;margin-top:9px;padding-top:9px;
    padding-right:78px;border-top:1px solid var(--strip-rule);color:var(--strip-fg);
    font-size:10px;white-space:nowrap}
  .k{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
    padding:0 6px;border:1px solid var(--key-border);border-radius:var(--key-radius);
    background:var(--key-bg);box-shadow:var(--key-shadow);color:var(--key-fg);
    font:600 10px ui-monospace,SFMono-Regular,monospace}
  #movedCount{margin-left:auto;color:var(--moved-fg);font-size:10px}

  button,input{font:inherit}
  button{min-height:var(--btn-h);padding:var(--btn-pad);border:1px solid var(--btn-border);
    border-radius:var(--btn-radius);background:var(--btn-bg);color:var(--btn-fg);
    box-shadow:var(--btn-shadow);font-weight:var(--btn-weight);cursor:pointer;
    transition:transform var(--btn-transition) ease,border-color var(--btn-transition) ease,
      background var(--btn-transition) ease,box-shadow var(--btn-transition) ease}
  button:hover{transform:translateY(-1px);border-color:var(--btn-hover-border);
    background:var(--btn-hover-bg);box-shadow:var(--btn-hover-shadow)}
  button:active{transform:translateY(0) var(--btn-press)}
  #btnExport,#btnSearch,#btnDown{border-color:var(--pri-border);background:var(--pri-bg);
    color:var(--pri-fg);box-shadow:var(--pri-shadow)}
  #btnExport:hover,#btnSearch:hover,#btnDown:hover{border-color:var(--pri-hover-border);
    background:var(--pri-hover-bg)}
  #btnReset,#btnClearDraft{color:var(--btn-danger-fg)}
  button:focus-visible,input:focus-visible,summary:focus-visible{
    outline:var(--focus-ring);outline-offset:var(--focus-offset)}
  button:disabled{opacity:var(--btn-disabled);cursor:not-allowed}

  /* segmented controls: language and theme */
  .seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:99px;
    background:var(--key-bg)}
  .seg button{min-height:22px;padding:2px 10px;border:0;border-radius:99px;background:transparent;
    box-shadow:none;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:.04em}
  .seg button:hover{transform:none;background:var(--chip-bg);box-shadow:none}
  .seg button[aria-pressed="true"]{background:var(--pri-bg);color:var(--pri-fg)}
  .badgeRow{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
  .switchRow{display:flex;gap:6px}

  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--boot-bg);font-size:13px;color:var(--boot-fg);text-align:center;z-index:50}
  #boot span{display:flex;flex-direction:column;gap:4px}
  #boot b{color:var(--boot-b-fg);font-size:var(--boot-b-size);font-weight:var(--boot-b-weight);
    letter-spacing:.04em}
  #boot small{color:var(--boot-small-fg);font-size:10px}
  #boot:after{content:"";width:7px;height:7px;margin-left:10px;border-radius:50%;
    background:var(--accent);box-shadow:var(--boot-dot-shadow);
    animation:pulse 1s ease-in-out infinite alternate}
  @keyframes pulse{to{opacity:.28;transform:scale(.72)}}
  .err{color:var(--err-fg);font-weight:var(--err-weight)}

  #rightDock{position:absolute;right:var(--gap);top:var(--gap);bottom:var(--gap);z-index:20;

    border:var(--dock-border);border-right:var(--dock-border-right);border-radius:var(--dock-radius);
    background:var(--dock-bg);box-shadow:var(--dock-shadow);

    color:var(--dock-head-fg);font:700 var(--dock-head-size) ui-monospace,SFMono-Regular,monospace;

    box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

    color:var(--dock-arrow-fg);font-size:16px;line-height:10px;transform:rotate(0);
    transition:transform .15s ease}

    background:var(--chip-bg);cursor:pointer;transition:.15s ease}

  #draftStatus{font-size:10px;color:var(--draft-fg);margin-top:7px}

    border-radius:var(--insp-radius);background:var(--insp-bg);color:var(--insp-fg)}

  #counts{padding:12px 13px;min-width:230px}
  #counts table,#extTable,#ext2Table{border-collapse:collapse;width:100%}

  #counts td:last-child{text-align:right;font-family:ui-monospace,monospace}

  #extTable td,#ext2Table td{padding:2px 3px}
  #extTable td.n,#ext2Table td.n{text-align:right;font-variant-numeric:tabular-nums}
  #extTable tr.sel,#ext2Table tr.sel{background:var(--sel-row-bg)}
  #counts .warn{color:var(--warn-fg);font-weight:800;text-shadow:var(--warn-shadow)}
  #extPane,#ext2Pane{z-index:10}

  #info{left:var(--gap);bottom:var(--gap);padding:var(--info-pad);max-width:660px;min-height:34px;
    border:var(--info-border);border-left:var(--info-rule);border-radius:var(--info-radius);
    background:var(--info-bg);color:var(--info-fg)}
  #exportPane{right:12px;top:12px;padding:15px;width:560px;max-height:calc(100vh - 24px);
    display:flex;flex-direction:column;background:var(--export-bg);z-index:40}
  #exportPane textarea{width:100%;flex:1;min-height:220px;font-family:ui-monospace,monospace;
    font-size:11px;white-space:pre;border:1px solid var(--ta-border);border-radius:var(--ta-radius);
    padding:10px;background:var(--ta-bg);color:var(--ta-fg);resize:vertical}
  #exportSummary{padding:9px 10px;margin:7px 0 9px;border:1px solid var(--ok-border);
    border-radius:10px;background:var(--ok-bg);color:var(--ok-fg)}
  #exportSummary.bad{border-color:var(--bad-border);background:var(--bad-bg);color:var(--bad-fg);
    font-weight:700}

  .lock-labels .tlt-label,.lock-codes .tlt-code-group text{
    pointer-events:none!important;cursor:not-allowed!important}
  .lock-blocks g.ext-wrap{pointer-events:none!important}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important}
  .state-symbol{font-weight:900;margin-right:3px}

  @media(max-width:980px){
    #topbar{width:min(468px,calc(100vw - 32px));max-width:none}
    #rightDock{left:16px;right:16px;top:auto;width:auto;bottom:16px;max-height:47vh}
    #info{max-width:calc(100vw - 32px)}
    #exportPane{left:12px;right:12px;width:auto;max-height:calc(100vh - 24px)}
  }
  @media(max-width:640px){
    #topbar{padding:12px}
    .shortcutStrip{display:none}
    #rightDock{max-height:43vh}

  }
  @media(prefers-reduced-motion:reduce){
    *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;
      animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

<body>
<div id="stage"><div id="host"></div></div>
<div id="boot"><span><b data-i18n="boot.title">Loading map…</b><small data-i18n="boot.hint"></small></span></div>

  <div class="actionRow">

  </div>
  <div class="actionRow">

    <span class="k" data-i18n="key.space"></span><span data-i18n="key.space.do"></span>
    <span class="k">←↑↓→</span><span data-i18n="key.arrows.do"></span>
    <span class="k">Esc</span><span data-i18n="key.esc.do"></span>
    <span class="k">L</span><span data-i18n="key.trace.do"></span>
  </div>
</div>

<div id="rightDock" data-i18n-attr="aria-label:dock.aria">
<div class="pane" id="searchPane">
  <b data-i18n="search.title"></b>
  <div id="searchRow">
    <label class="sr-only" for="stationSearch" data-i18n="search.label"></label>
    <input id="stationSearch" list="stationChoices" autocomplete="off"
           data-i18n-attr="placeholder:search.placeholder">
    <datalist id="stationChoices"></datalist>
    <button id="btnSearch" data-i18n="search.go" data-i18n-attr="aria-label:search.go.aria"></button>

</div>
<div class="pane" id="layerPane">

    <label><input type="checkbox" data-layer="labels" checked><span data-i18n="kind.labels"></span></label>
    <label><input type="checkbox" data-layer="codes" checked><span data-i18n="kind.codes"></span></label>
    <label><input type="checkbox" data-layer="leaders" checked><span data-i18n="kind.leaders"></span></label>
    <label><input type="checkbox" data-layer="blocks" checked><span data-i18n="kind.blocks"></span></label>
    <label><input type="checkbox" data-layer="newlines" checked><span data-i18n="kind.newlines"></span></label>

    <button id="btnCopy" style="float:right" data-i18n="export.copy"></button><button id="btnDown" style="float:right;margin-right:4px" data-i18n="export.download"></button>

  <textarea id="exportText" spellcheck="false" data-i18n-attr="aria-label:export.textLabel"></textarea>

<script>
"use strict";
/* =======================================================================
   Transit Label Tuner — a read-only editor for transit diagrams.

   The tool never writes SVG. It emits a *move list*: a plain-text table of
   the offsets you dragged. Your own generator re-renders the diagram from
   that table, so the published artwork is always machine-generated and the
   edits stay reviewable, diffable and replayable.

   Single source of geometry
   -------------------------
   The quadrant slots, the overlap test (SAT) and the panel-rect rule are the
   contract between this tool and whatever applies the move list downstream.
   If you port this to your own pipeline, keep them in one place and assert
   they match — a browser that disagrees with your batch checker is worse
   than no checker at all.
   ======================================================================= */

/* =========================== CONFIG ====================================
   Everything diagram-specific lives here. Point it at your own SVG and the
   rest of the tool follows. See README.md for the structure a map must have.
   ===================================================================== */
const CONFIG = {
  /* Loaded when no ?svg= is given. */
  defaultSvg: "demo/demo-map.svg",

  /* How to find things in the SVG. The data-* attribute names are fixed:
     stations need data-name/data-code/data-x/data-y, code groups need
     data-name/data-code/data-station-x/data-station-y. */
  selectors: {
    station:   "g.stn-g",
    label:     "text.lbl",
    codeGroup: "g.stn-code",
    leader:    "line.ldr",
    route:     'path[class^="rt"]'
  },

  /* Station-code quadrants: offset from the station centre plus the
     text-anchor that goes with it. A code is only ever allowed to sit on
     one of these eight positions, so a drag can never invent a new one. */
  slots: {
    "S":  [ 0.0,  12.0, "middle"],
    "E":  [ 8.0,   2.5, "start" ],
    "W":  [-8.0,   2.5, "end"   ],
    "N":  [ 0.0,  -8.0, "middle"],
    "NE": [ 8.0,  -6.0, "start" ],
    "SE": [ 8.0,   7.0, "start" ],
    "NW": [-8.0,  -7.0, "end"   ],
    "SW": [-8.0,  10.5, "end"   ]
  },

  /* The angle ladder for slanted labels. Deliberately a short list: if a
     one-off angle existed in the artwork, leaving it out of the ladder stops
     users from snapping onto it and quietly breeding a second one. */
  snapAngles: [0, -40, -50, -60, -70],

  /* Layout blocks that can be dragged and scaled as a unit. `id` must match
     an element id in the SVG; `key` is looked up in the translation table. */
  blocks: [
    {id: "title-block",        key: "block.title"},
    {id: "legend",             key: "block.legend"},
    {id: "under-construction", key: "block.construction"},
    {id: "outlying",           key: "block.outlying"},
    {id: "notes",              key: "block.notes"}
  ],

  /* "Not to scale" proposal boxes. The tool locates each one by its marker
     text and the smallest rect that contains it, then lets you drag the whole
     box. `keys` maps "roundedX,roundedY" of that rect to the identifier your
     downstream applier uses; a box with no key exports as a warning instead
     of being silently dropped. */
  schematic: {
    marker: /SCHEMATIC ONLY/,
    keys: {"25,300": "Harbour Line|Phase 2"},
    setback: 15            /* corner radius convention, in map units */
  },

  limits: {
    maxOffset: 120,        /* refuse to export a label dragged further than this */
    panelAreaRatio: 0.12,  /* a filled rect smaller than this share of the canvas
                              counts as a panel/card that labels must not cover */
    leaderStationEnd: 1.0, /* leader x1,y1 must sit this close to the station */
    leaderLabelEnd: 30     /* leader x2,y2 must start this close to the label */
  },

  formatVersion: "2",

  /* May be replaced by a packaging step with the source SVG's SHA-256. When
     left as the placeholder, boot computes a fingerprint from the fetched
     SVG so drafts remain isolated by drawing revision. */
  sourceFingerprint: "__SOURCE_SHA256__"
};

/* Back-compat aliases used throughout the file. */
const SLOTS = CONFIG.slots;
const SNAP_ANGLES = CONFIG.snapAngles;
const SEL = CONFIG.selectors;
const PANEL_FORMAT_VERSION = CONFIG.formatVersion;
let SOURCE_FINGERPRINT = CONFIG.sourceFingerprint;

const qs = new URLSearchParams(location.search);
const SVG_PATH = qs.get("svg") || CONFIG.defaultSvg;
/* Test-only alternate selectors prove that behaviour follows CONFIG rather
   than the demo map's class names. They describe the same demo structure by
   attributes and container ids. */
if(qs.get("selectortest")==="attrs") Object.assign(SEL,{
  station:"g[data-name][data-code][data-x][data-y]",
  label:"#labels > text",codeGroup:"g[data-station-x][data-station-y]",
  leader:"#leaders > line",route:'#routes > path:not([class$="-casing"])'
});

const $ = s => document.querySelector(s);
const stage = $("#stage"), host = $("#host");

/* =========================== i18n ======================================

   Static markup is translated through data-i18n / data-i18n-attr; anything

     · Error() messages thrown by the window.* scripting hooks — those are

   ===================================================================== */

/* =========================== theme ====================================
   The stylesheet declares every theme-dependent value as a custom property
   under :root[data-theme=...]. Switching themes is therefore one attribute
   write — no class juggling, no duplicated rules, and a third theme is a
   third variable block rather than a third copy of the stylesheet.
   ===================================================================== */
const THEME_KEY = "transit-label-tuner:theme";
function pickTheme(){
  const forced = qs.get("theme");
  if(forced === "light" || forced === "dark") return forced;
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  if(saved === "light" || saved === "dark") return saved;
  /* Fall back to the operating system, and to light when it has no opinion. */
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches
       ? "dark" : "light";
}
let THEME = pickTheme();
function applyTheme(){
  document.documentElement.setAttribute("data-theme", THEME);
  for(const b of document.querySelectorAll("#themeSwitch button"))
    b.setAttribute("aria-pressed", String(b.dataset.theme === THEME));
}
function setTheme(next){
  if(next !== "light" && next !== "dark") return;
  THEME = next;
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme();
}
applyTheme();
for(const b of document.querySelectorAll("#themeSwitch button"))
  b.addEventListener("click", ()=> setTheme(b.dataset.theme));
/* Follow the system only while the user has not chosen for themselves. */
if(window.matchMedia){
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e=>{
    let saved = null;
    try{ saved = localStorage.getItem(THEME_KEY); }catch(err){}
    if(!saved && !qs.get("theme")){ THEME = e.matches ? "dark" : "light"; applyTheme(); }
  });
}
window.__theme = ()=>THEME;

const LANG_KEY = "transit-label-tuner:lang";
function pickLang(){
  const forced = qs.get("lang");
  if(forced && I18N[forced]) return forced;
  let saved = null;
  try{ saved = localStorage.getItem(LANG_KEY); }catch(e){}
  if(saved && I18N[saved]) return saved;
  return /^zh/i.test(navigator.language || "") ? "zh" : "en";
}
let LANG = pickLang();

/* t("some.key", {a:1}) — missing keys fall back to English, then to the key
   itself, so a half-finished translation degrades instead of printing blanks. */
function t(key, params){
  let s = (I18N[LANG] && I18N[LANG][key]);
  if(s === undefined) s = (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if(params) for(const k in params) s = s.split("{"+k+"}").join(String(params[k]));
  return s;
}

/* Rich translation templates contain a small, trusted set of tags. Values
   substituted into those templates may come from a loaded SVG or a search
   box, so escape parameters before inserting the result with innerHTML. */
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, ch=>({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[ch]);
}
function tHTML(key, params){
  const safe={};
  if(params) for(const k in params) safe[k]=escapeHTML(params[k]);
  return t(key, safe);
}
function tEnglish(key, params){
  let s=(I18N.en[key]!==undefined ? I18N.en[key] : key);
  if(params) for(const k in params) s=s.split("{"+k+"}").join(String(params[k]));
  return s;
}

/* Re-render every translated string in the static markup. Runtime strings
   (info line, tables, inspector) are refreshed by relabelUI() below. */
function applyStaticI18n(root){
  for(const el of (root||document).querySelectorAll("[data-i18n]")){
    const v = t(el.getAttribute("data-i18n"));
    if(/[<&]/.test(v)) el.innerHTML = v; else el.textContent = v;
  }
  for(const el of (root||document).querySelectorAll("[data-i18n-attr]")){
    for(const pair of el.getAttribute("data-i18n-attr").split(";")){
      const i = pair.indexOf(":");
      if(i < 0) continue;
      el.setAttribute(pair.slice(0, i).trim(), t(pair.slice(i + 1).trim()));
    }
  }
  /* The dock heading is CSS-generated content, so it is fed through a
     custom property rather than a data-i18n attribute. */
  document.documentElement.style.setProperty("--dock-label",
    JSON.stringify(t("dock.aria")));
  document.documentElement.lang = (LANG === "zh") ? "zh-Hant" : "en";
  /* document.title doubles as the ?test= result channel for headless runs —
     never overwrite a result that has already been published there. */
  if(!/^RESULT/.test(document.title)) document.title = t("app.title");
}

/* Hook point: later layers register a callback so switching language redraws
   the tables and the info line they own. */
const RELABEL = [];
function relabelUI(){ for(const fn of RELABEL){ try{ fn(); }catch(e){} } }

function setLang(next){
  if(!I18N[next]) return;
  LANG = next;
  try{ localStorage.setItem(LANG_KEY, next); }catch(e){}
  applyStaticI18n();
  for(const b of document.querySelectorAll("#langSwitch button"))
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG));
  relabelUI();
}
for(const b of document.querySelectorAll("#langSwitch button"))
  b.addEventListener("click", ()=> setLang(b.dataset.lang));
applyStaticI18n();
for(const b of document.querySelectorAll("#langSwitch button"))
  b.setAttribute("aria-pressed", String(b.dataset.lang === LANG));

/* =========================== Geometry ==================================
   Separating-axis overlap test for rotated text boxes, plus a circle-vs-
   polygon test for station dots. Everything works in *map user units*, not
   screen pixels, so zooming and panning cannot change a single verdict —
   the browser and any offline checker always agree.
   ===================================================================== */
/* root  = outer <svg>, page layout only.
   mapEl = inner <svg>; station data-x/data-y and every label x/y live in
           its coordinate system. The two differ by the inner viewBox scale.
   All geometry is converted into mapEl units (= the units of dx/dy in the
   exported move list). Skip the conversion and one screen pixel of drag
   becomes several units, and the dots stop lining up with the names. */
let root = null, mapEl = null, mapInv = null, mapCTM = null;
function userCorners(el){
  const b = el.getBBox(), m = mapInv.multiply(el.getScreenCTM());
  const pts=[[b.x,b.y],[b.x+b.width,b.y],[b.x+b.width,b.y+b.height],[b.x,b.y+b.height]];
  return pts.map(([x,y])=>({x:m.a*x+m.c*y+m.e, y:m.b*x+m.d*y+m.f}));
}
function axes(p){const a=[];for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];
  const ex=q.x-p[i].x, ey=q.y-p[i].y; const l=Math.hypot(ex,ey)||1; a.push({x:-ey/l,y:ex/l});}return a;}
function overlap(p1,p2){
  for(const ax of axes(p1).concat(axes(p2))){
    let a0=Infinity,a1=-Infinity,b0=Infinity,b1=-Infinity;
    for(const p of p1){const d=p.x*ax.x+p.y*ax.y;a0=Math.min(a0,d);a1=Math.max(a1,d);}
    for(const p of p2){const d=p.x*ax.x+p.y*ax.y;b0=Math.min(b0,d);b1=Math.max(b1,d);}
    if(a1<=b0+0.01||b1<=a0+0.01) return false;
  }
  return true;
}
function bounds(p){return {x0:Math.min(...p.map(q=>q.x)),x1:Math.max(...p.map(q=>q.x)),
                           y0:Math.min(...p.map(q=>q.y)),y1:Math.max(...p.map(q=>q.y))};}
function cheap(a,b){return !(a.b.x1<b.b.x0||b.b.x1<a.b.x0||a.b.y1<b.b.y0||b.b.y1<a.b.y0);}
function circPoly(c,p){
  let inside=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    if(((p[i].y>c.cy)!==(p[j].y>c.cy)) &&
       (c.cx<(p[j].x-p[i].x)*(c.cy-p[i].y)/((p[j].y-p[i].y)||1e-9)+p[i].x)) inside=!inside;}
  if(inside) return true;
  for(let i=0;i<p.length;i++){
    const a=p[i], b=p[(i+1)%p.length];
    const ex=b.x-a.x, ey=b.y-a.y, L2=(ex*ex+ey*ey)||1;
    let t=((c.cx-a.x)*ex+(c.cy-a.y)*ey)/L2; t=Math.max(0,Math.min(1,t));
    const dx=a.x+t*ex-c.cx, dy=a.y+t*ey-c.cy;
    if(dx*dx+dy*dy<=c.r*c.r) return true;}
  return false;
}

/* =========================== Model ==================================== */
const M = {
  stations: [],        /* {name, code, x, y, r, el} */
  labels:   [],        /* station-name labels */
  codes:    [],        /* station-code labels */
  panels:   [],        /* panels / cards / legend (frozen at load) */
  byKey:    new Map(), /* "name|code"                 -> label */
  codeByKey:new Map(), /* "name|data-code|code text"  -> code  */
  undo:     []
};

function num(el, k, d){ const v = el.getAttribute(k); const f = parseFloat(v); return isNaN(f)? d : f; }
function fmt(v){ const r = Math.round(v); return Math.abs(v-r)<1e-6 ? String(r) : (Math.round(v*10)/10).toFixed(1); }

function parseRotate(el){
  const t = el.getAttribute("transform") || "";
  const m = /rotate\(\s*(-?[\d.]+)[\s,]+(-?[\d.]+)[\s,]+(-?[\d.]+)\s*\)/.exec(t);
  return m ? {a:parseFloat(m[1]), cx:parseFloat(m[2]), cy:parseFloat(m[3])} : null;
}

function updateLabelA11y(L){
  if(!L.st){ L.el.removeAttribute("tabindex"); L.el.removeAttribute("aria-label"); return; }
  L.el.setAttribute("tabindex","0");
  L.el.setAttribute("aria-label",t("a11y.label",{name:L.text,code:L.st.code}));
}
RELABEL.push(()=>{ for(const L of M.labels) updateLabelA11y(L); });

function buildModel(){
  /* --- stations: data-x/data-y are authoritative, not the rendered circle --- */
  for(const el of root.querySelectorAll(SEL.station)){
    el.classList.add("tlt-station");
    let r = 0;
    for(const c of el.querySelectorAll("circle")) r = Math.max(r, parseFloat(c.getAttribute("r"))||0);
    if(!(r>0)) r = 10.2;                       /* dots drawn as <path> get the house default */
    M.stations.push({el, name: el.getAttribute("data-name")||"", code: el.getAttribute("data-code")||"",
                     x: num(el,"data-x",0), y: num(el,"data-y",0), r});
  }
  const byName = new Map();
  for(const s of M.stations){ if(!byName.has(s.name)) byName.set(s.name, []); byName.get(s.name).push(s); }

  /* --- names: a label belongs to the nearest station sharing its text.
         This mirrors how a downstream applier finds the element again, so
         what you see here is what it will move. --- */
  for(const el of root.querySelectorAll(SEL.label)){
    el.classList.add("tlt-label");
    const t = el.textContent;
    const x = num(el,"x",0), y = num(el,"y",0);
    const cands = byName.get(t) || [];
    let st = null, bd = Infinity;
    for(const s of cands){ const d = Math.hypot(s.x-x, s.y-y); if(d<bd){bd=d; st=s;} }
    const rot = parseRotate(el);
    const L = {el, text:t, st, dist:bd,
               x, y, x0:x, y0:y,
               anchor: el.getAttribute("text-anchor") || "start",
               anchor0: el.getAttribute("text-anchor") || "start",
               rot: rot? rot.a : null, rot0: rot? rot.a : null,
               hasRot: !!rot, ldr:null, code:null, veto:false};
    M.labels.push(L);
    updateLabelA11y(L);
    if(st) M.byKey.set(t+"|"+st.code, L);
  }

  /* --- station codes --- */
  for(const g of root.querySelectorAll(SEL.codeGroup)){
    g.classList.add("tlt-code-group");
    const name = g.getAttribute("data-name")||"", dcode = g.getAttribute("data-code")||"";
    const sx = num(g,"data-station-x",NaN), sy = num(g,"data-station-y",NaN);
    for(const el of g.querySelectorAll("text")){
      const C = {el, g, name, dcode, text: el.textContent, sx, sy,
                 x: num(el,"x",0), y: num(el,"y",0), x0: num(el,"x",0), y0: num(el,"y",0),
                 anchor: el.getAttribute("text-anchor")||"start",
                 anchor0: el.getAttribute("text-anchor")||"start",
                 grabbed:false, veto:false};
      C.slot0 = slotOf(C.x0-sx, C.y0-sy, C.anchor0);
      M.codes.push(C);
      M.codeByKey.set(name+"|"+dcode+"|"+C.text, C);
    }
  }
  /* name <-> code: same station */
  const codeByStn = new Map();
  for(const c of M.codes) codeByStn.set(c.name+"|"+c.dcode, c);
  for(const L of M.labels) if(L.st) L.code = codeByStn.get(L.st.name+"|"+L.st.code) || null;

  /* --- leaders: x1,y1 must sit on the station, x2,y2 near the label's
         original position. Bound **at load time** — once a name has been
         dragged away, the pairing can no longer be recovered. --- */
  const leaders = [...root.querySelectorAll(SEL.leader)].map(el=>({el,
    x1:num(el,"x1",0), y1:num(el,"y1",0), x2:num(el,"x2",0), y2:num(el,"y2",0)}));
  for(const L of M.labels){
    if(!L.st) continue;
    let best=null, bd=Infinity;
    for(const g of leaders){
      if(Math.hypot(g.x1-L.st.x, g.y1-L.st.y) > CONFIG.limits.leaderStationEnd) continue;
      const d = Math.hypot(g.x2-L.x0, g.y2-L.y0);
      if(d < CONFIG.limits.leaderLabelEnd && d < bd){ bd=d; best=g; }
    }
    if(best){ best.x20=best.x2; best.y20=best.y2; L.ldr=best; }
  }

  /* --- panels / cards / legend: any filled rect smaller than
         limits.panelAreaRatio of the canvas. **Computed once at load and
         then frozen**: the ratio only holds while the whole SVG is scaled
         uniformly, so recomputing after a zoom would let the browser and an
         offline checker disagree about what is covered. --- */
  const _svgRect = root.getBoundingClientRect();
  const _svgArea = Math.max(1, _svgRect.width*_svgRect.height);
  for(const el of root.querySelectorAll("rect")){
    const r = el.getBoundingClientRect();
    const fill = el.getAttribute("fill")||"";
    const area = r.width*r.height;
    if(fill==="none" || !(area>0) || area >= CONFIG.limits.panelAreaRatio*_svgArea) continue;
    /* screen rect -> map coordinates (frozen) */
    const c = [[r.left,r.top],[r.right,r.top],[r.right,r.bottom],[r.left,r.bottom]]
      .map(([x,y])=>{ const p = root.createSVGPoint(); p.x=x; p.y=y;
                      const q = p.matrixTransform(mapInv); return {x:q.x, y:q.y}; });
    M.panels.push({el, fill, p:c, b:bounds(c)});
  }
}

/* Flag everything that already sits on a panel. On a dense diagram this is
   thousands of objects against hundreds of panels; running it synchronously
   before removing the boot overlay looks like a hang, so yield a frame every
   64 items and let the map be usable while it finishes. */
/* Yield to the browser for one frame. requestAnimationFrame alone is not
   enough: a headless renderer or a backgrounded tab may throttle it to zero,
   and anything awaiting it then never resumes. Race it against a timer so
   progress is guaranteed either way. */
function nextFrame(){
  return new Promise(res=>{
    let done = false;
    const go = ()=>{ if(!done){ done = true; res(); } };
    requestAnimationFrame(go);
    setTimeout(go, 32);
  });
}
async function vetoAllAsync(){
  const all = M.labels.concat(M.codes);
  for(let i=0;i<all.length;i++){
    checkVeto(all[i]);
    if(i && i%64===0) await nextFrame();
  }
}
/* Synchronous variant, for restoring a state where the caller needs the veto
   flags to be correct before it repaints. */
function vetoAll(){ for(const o of M.labels.concat(M.codes)) checkVeto(o); }

function slotOf(dx, dy, anchor){
  for(const k in SLOTS){
    const s = SLOTS[k];
    if(Math.abs(dx-s[0])<0.05 && Math.abs(dy-s[1])<0.05 && anchor===s[2]) return k;
  }
  return "custom";   /* not one of the eight slots — kept verbatim in exports */
}
function nearestSlot(dx, dy){
  let best=null, bd=Infinity;
  for(const k in SLOTS){
    const s = SLOTS[k], d = Math.hypot(dx-s[0], dy-s[1]);
    if(d < bd){ bd=d; best=k; }
  }
  return best;
}

/* =========================== Writing positions ======================== */
function writeLabel(L){
  L.el.setAttribute("x", fmt(L.x));
  L.el.setAttribute("y", fmt(L.y));
  L.el.setAttribute("text-anchor", L.anchor);
  if(L.hasRot) L.el.setAttribute("transform", "rotate("+fmt(L.rot)+" "+fmt(L.x)+" "+fmt(L.y)+")");
  if(L.ldr){                      /* the leader's label end follows the label */
    L.ldr.el.setAttribute("x2", fmt(L.ldr.x20 + (L.x - L.x0)));
    L.ldr.el.setAttribute("y2", fmt(L.ldr.y20 + (L.y - L.y0)));
  }
  L.el.classList.toggle("dt-moved", isMoved(L));
  checkVeto(L);
  if(typeof EXT_OBS!=="undefined") EXT_OBS=null;
}
function writeCode(C){
  C.el.setAttribute("x", fmt(C.x));
  C.el.setAttribute("y", fmt(C.y));
  C.el.setAttribute("text-anchor", C.anchor);
  C.el.classList.toggle("dt-moved", codeSlot(C)!==C.slot0);
  checkVeto(C);
  if(typeof EXT_OBS!=="undefined") EXT_OBS=null;
}
function isMoved(L){
  return Math.abs(L.x-L.x0)>1e-6 || Math.abs(L.y-L.y0)>1e-6 ||
         L.anchor!==L.anchor0 || (L.rot||0)!==(L.rot0||0);
}
function codeSlot(C){ return slotOf(C.x-C.sx, C.y-C.sy, C.anchor); }

/* =========================== Angles ====================================
   Slanted labels may only sit on CONFIG.snapAngles. Angles that exist in the
   artwork but are deliberately left out of the ladder (a one-off 40°, say)
   are not snap targets and are never pulled onto the ladder silently — the
   tool says so in the info line first. The one exception is \ , which puts a
   label back to its original angle; that restores, it does not invent.

   Only labels that are *already* rotated can be stepped. Adding an angle to
   a horizontal label changes the character of the whole chain, so it is a
   deliberate design decision, not something a drag should do — and most
   appliers refuse a rotate that was not there before.

   Angle changes export as their own rows, separate from position moves, so
   "drag it, then straighten it" produces two independent edits that cannot
   overwrite one another.
   ===================================================================== */
/* Folding an off-ladder angle onto the ladder: pick the rung with the
   closest *tilt magnitude*; on a tie take the steeper one. So +40° becomes
   −40° (same tilt, conventional direction) and 78° becomes −70°. */
function snapIntoLadder(a){
  let best = null, bd = Infinity;
  for(const s of SNAP_ANGLES){
    const d = Math.abs(Math.abs(s) - Math.abs(a));
    if(d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && Math.abs(s) > Math.abs(best))){ bd = d; best = s; }
  }
  return best;
}
function setAngle(L, ang){
  if(!L.hasRot) throw new Error(L.text+" has no angle; this tool does not add one");
  if(SNAP_ANGLES.indexOf(ang)<0 && ang!==L.rot0)
    throw new Error("Angle "+ang+" is not in the snap set "+SNAP_ANGLES);
  pushUndo(); L.rot = ang; writeLabel(L);
  scheduleCount(); updateMovedCount(); describe(L, L.code);
  return L.rot;
}
function stepAngle(L, dir, absolute){
  if(!L.hasRot){
    setInfo(tHTML("angle.noRotate", {text:L.text}), true);
    return null;
  }
  if(absolute !== null && absolute !== undefined){ return setAngle(L, absolute); }
  const i = SNAP_ANGLES.indexOf(L.rot);
  if(i < 0){
    /* An off-ladder one-off angle. Folding it onto the ladder is an
       improvement, not a violation, so allow it — but say so, and keep the
       tilt magnitude identical rather than rotating to something arbitrary.
       \ returns to the original angle at any time. */
    const snapped = snapIntoLadder(L.rot);
    setInfo(tHTML("angle.caseAngle", {text:L.text, from:fmt(L.rot),
                                  to:fmt(snapped), orig:fmt(L.rot0)}));
    return setAngle(L, snapped);
  }
  const j = i + dir;
  if(j < 0 || j >= SNAP_ANGLES.length){
    setInfo(tHTML("angle.ladderEnd", {text:L.text, a:fmt(L.rot)}), true);
    return null;
  }
  return setAngle(L, SNAP_ANGLES[j]);
}

/* Hard veto against panels: turns red the moment it is dragged onto one */
function checkVeto(o){
  const p = userCorners(o.el), b = bounds(p);
  let hit = false;
  for(const q of M.panels){ if(!(b.x1<q.b.x0||q.b.x1<b.x0||b.y1<q.b.y0||q.b.y1<b.y0) && overlap(p,q.p)){ hit=true; break; } }
  o.veto = hit;
  o.el.classList.toggle("dt-veto", hit);
  return hit;
}

/* =========================== Zoom and pan ============================= */
/* Zooming sets the SVG element's CSS width — a uniform scale of the whole
   drawing. The viewBox is never touched, so getScreenCTM() stays correct
   for free and no geometry has to be re-derived. */
let VB = {w:1684, h:1188}, baseW = 1684, zoom = 1, panX = 0, panY = 0;
function applyView(){
  root.style.width = (baseW*zoom)+"px";
  root.style.height = "auto";
  host.style.transform = "translate("+panX+"px,"+panY+"px)";
  syncCTM();
}
function syncCTM(){ mapCTM = mapEl.getScreenCTM(); mapInv = mapCTM.inverse(); }
function fitAll(){
  const r = stage.getBoundingClientRect();
  /* Fit into the rectangle left by the dock. It sits on the right at desktop
     widths and moves to the bottom below 980px; both layouts must keep the
     complete drawing out from underneath it. */
  const d = $("#rightDock").getBoundingClientRect();
  const onRight = d.width>0 && d.left >= r.left+r.width*0.5;
  const onBottom = d.height>0 && d.top >= r.top+r.height*0.5;
  const availW = Math.max(240, onRight ? d.left-r.left-16 : r.width);
  const availH = Math.max(160, onBottom ? d.top-r.top-16 : r.height);
  zoom = Math.min(availW/baseW, availH/(baseW*VB.h/VB.w)) * 0.98;
  const drawW=baseW*zoom, drawH=drawW*VB.h/VB.w;
  panX = (availW-drawW)/2; panY = (availH-drawH)/2;
  applyView(); scheduleCount();
}
stage.addEventListener("wheel", e=>{
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  const k = Math.exp(-e.deltaY*0.0015), nz = Math.max(0.1, Math.min(40, zoom*k)), f = nz/zoom;
  panX = mx - (mx-panX)*f; panY = my - (my-panY)*f; zoom = nz;
  applyView(); scheduleCount();
}, {passive:false});

let panning = null, spaceDown = false;
stage.addEventListener("mousedown", e=>{
  if(e.button===1 || (e.button===0 && (spaceDown || !e.target.closest("text")))){
    panning = {x:e.clientX, y:e.clientY, px:panX, py:panY};
    stage.classList.add("panning"); e.preventDefault();
  }
});

/* =========================== Dragging ================================= */
let drag = null, sel = null;

function snapshot(){
  return {labels: M.labels.map(L=>({L, x:L.x, y:L.y, anchor:L.anchor, rot:L.rot})),
          codes:  M.codes.map(C=>({C, x:C.x, y:C.y, anchor:C.anchor, grabbed:C.grabbed}))};
}
function pushUndo(){ M.undo.push(snapshot()); if(M.undo.length>200) M.undo.shift(); }
function restore(s){
  for(const r of s.labels){ r.L.x=r.x; r.L.y=r.y; r.L.anchor=r.anchor; r.L.rot=r.rot; writeLabel(r.L); }
  for(const r of s.codes){ r.C.x=r.x; r.C.y=r.y; r.C.anchor=r.anchor; r.C.grabbed=r.grabbed; writeCode(r.C); }
  scheduleCount(); updateMovedCount();
}

/* screen pixels -> map units (includes the inner viewBox scale) */
function userScale(){ syncCTM(); return Math.hypot(mapCTM.a, mapCTM.b); }

host.addEventListener("mousedown", e=>{
  if(e.button!==0 || spaceDown) return;
  const tg = e.target;
  let obj = null, kind = null;
  if(tg.matches(SEL.label)){ obj = M.labels.find(L=>L.el===tg); kind="name"; }
  else if(tg.closest(SEL.codeGroup) && tg.tagName.toLowerCase()==="text"){
    obj = M.codes.find(C=>C.el===tg); kind="code";
  }
  if(!obj) return;
  if(kind==="name" && !obj.st){ setInfo(tHTML("sel.noStation", {text:obj.text}), true); return; }
  e.preventDefault(); e.stopPropagation();
  pushUndo();
  select(kind==="name"? obj : (obj.g && M.labels.find(L=>L.code===obj)) || null, obj, kind);
  drag = {obj, kind, sx:e.clientX, sy:e.clientY, ox:obj.x, oy:obj.y,
          ghost: (kind==="name" && obj.code) ? {C:obj.code, x:obj.code.x, y:obj.code.y} : null};
});

window.addEventListener("mousemove", e=>{
  if(panning){
    panX = panning.px + (e.clientX-panning.x); panY = panning.py + (e.clientY-panning.y);
    applyView(); return;
  }
  if(!drag) return;
  const k = userScale();
  const dx = (e.clientX-drag.sx)/k, dy = (e.clientY-drag.sy)/k;
  drag.obj.x = drag.ox + dx; drag.obj.y = drag.oy + dy;
  if(drag.kind==="name"){
    writeLabel(drag.obj);
    /* The code tags along during the drag so it reads as one unit, then
       snaps back to its own quadrant on release: a code's position is an
       independent decision and must not drift just because the name moved. */
    if(drag.ghost){ drag.ghost.C.el.setAttribute("transform","translate("+fmt(dx)+","+fmt(dy)+")"); }
  } else writeCode(drag.obj);
});

window.addEventListener("mouseup", ()=>{
  if(panning){ panning=null; stage.classList.remove("panning"); scheduleCount(); }
  if(!drag) return;
  const o = drag.obj;
  if(drag.kind==="name"){
    /* Snap the *offset* to whole units while keeping the original fractional
       baseline, so a label that started at -9.9 and is nudged +18 lands on
       8.1 rather than being rounded to 8. */
    o.x = o.x0 + Math.round(o.x - o.x0);
    o.y = o.y0 + Math.round(o.y - o.y0);
    writeLabel(o);
    if(drag.ghost) drag.ghost.C.el.removeAttribute("transform");
  }else{
    /* codes snap to the nearest legal quadrant */
    const s = SLOTS[nearestSlot(o.x-o.sx, o.y-o.sy)];
    o.x = o.sx + s[0]; o.y = o.sy + s[1]; o.anchor = s[2];
    o.grabbed = true;                     /* only hand-grabbed codes are exported */
    writeCode(o);
  }
  drag = null; scheduleCount(); updateMovedCount(); describe();
});

/* hover -> highlight the name, its code and its leader together */
host.addEventListener("mouseover", e=>{
  const tg = e.target;
  let L = null;
  if(tg.matches(SEL.label)) L = M.labels.find(x=>x.el===tg);
  else if(tg.closest(SEL.codeGroup) && tg.tagName.toLowerCase()==="text"){
    const C = M.codes.find(x=>x.el===tg); L = C ? M.labels.find(x=>x.code===C) : null;
    if(C) hot(L, C);
    return;
  }
  if(L) hot(L, L.code);
});
host.addEventListener("mouseout", ()=>unhot());
let hotSet = [];
function hot(L, C){
  unhot();
  if(L){ L.el.classList.add("dt-hot"); hotSet.push([L.el,"dt-hot"]);
         if(L.ldr){ L.ldr.el.classList.add("dt-hot-ldr"); hotSet.push([L.ldr.el,"dt-hot-ldr"]); } }
  if(C){ C.el.classList.add("dt-hot"); hotSet.push([C.el,"dt-hot"]); }
  describe(L, C);
}
function unhot(){ for(const [el,c] of hotSet) el.classList.remove(c); hotSet=[]; }

function select(L, obj, kind){
  if(sel) sel.el.classList.remove("dt-sel");
  sel = obj; obj.el.classList.add("dt-sel"); sel._kind = kind;
}

/* SVG labels are in the normal Tab order. Focusing one enters the exact same
   selection path used by a mouse press, after which the existing arrow-key
   handler provides one-unit nudges. */
host.addEventListener("focusin",e=>{
  if(!e.target.matches || !e.target.matches(SEL.label)) return;
  const L=M.labels.find(x=>x.el===e.target);
  if(!L || !L.st) return;
  select(L,L,"name"); hot(L,L.code);
});

window.addEventListener("keydown", e=>{
  if(e.target && e.target.closest && e.target.closest("input,textarea")) return;
  if(e.code==="Space"){ spaceDown = true; }
  if(e.key==="Escape"){ if(sel){ sel.el.classList.remove("dt-sel"); sel=null; } }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){
    e.preventDefault(); const s = M.undo.pop(); if(s) restore(s); return;
  }
  const d = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[e.key];
  if(d && sel){
    e.preventDefault(); pushUndo();
    sel.x += d[0]; sel.y += d[1];
    if(sel._kind==="name") writeLabel(sel);
    else { const s = SLOTS[nearestSlot(sel.x-sel.sx, sel.y-sel.sy)];
           sel.x = sel.sx+s[0]; sel.y = sel.sy+s[1]; sel.anchor = s[2]; sel.grabbed = true; writeCode(sel); }
    scheduleCount(); updateMovedCount(); describe();
  }
  /* Angles: [ flattens, ] steepens, \ returns to the original. Only labels
     that already carry a rotate() can be stepped — see the Angles section. */
  if(sel && sel._kind==="name" && (e.key==="[" || e.key==="]" || e.key==="\\")){
    e.preventDefault();
    if(e.key==="\\") stepAngle(sel, 0, sel.rot0);
    else stepAngle(sel, e.key==="]" ? +1 : -1, null);
  }
});
window.addEventListener("keyup", e=>{ if(e.code==="Space") spaceDown=false; });

/* =========================== Overlap counts ===========================
   Same categories and same verdicts an offline checker would produce. Only
   what is in view is counted, so the numbers move as you pan — that is the
   point: they are a live readout, not a report.

   Codes stacked at the same interchange are excluded on purpose; they are a
   drawing convention, not a collision.
   ===================================================================== */
let countTimer = null;
function scheduleCount(){ clearTimeout(countTimer); countTimer = setTimeout(recount, 160); }
function viewportUser(){
  const r = stage.getBoundingClientRect();
  const p1 = root.createSVGPoint(); p1.x=r.left; p1.y=r.top;
  const p2 = root.createSVGPoint(); p2.x=r.right; p2.y=r.bottom;
  const a = p1.matrixTransform(mapInv), b = p2.matrixTransform(mapInv);
  return {x0:Math.min(a.x,b.x), x1:Math.max(a.x,b.x), y0:Math.min(a.y,b.y), y1:Math.max(a.y,b.y)};
}
function recount(){
  syncCTM();
  const V = viewportUser();
  const inV = o => !(o.b.x1<V.x0||V.x1<o.b.x0||o.b.y1<V.y0||V.y1<o.b.y0);
  const names = [], codes = [], stns = [];
  for(const L of M.labels){ const p=userCorners(L.el); const o={t:L.text,el:L.el,p,b:bounds(p)}; if(inV(o)) names.push(o); }
  for(const C of M.codes){ const p=userCorners(C.el);
    const o={t:C.text,owner:C.name,sx:C.sx,sy:C.sy,p,b:bounds(p)}; if(inV(o)) codes.push(o); }
  for(const s of M.stations){ const o={name:s.name,code:s.code,x:s.x,y:s.y,cx:s.x,cy:s.y,r:s.r,
      b:{x0:s.x-s.r,x1:s.x+s.r,y0:s.y-s.r,y1:s.y+s.r}}; if(inV(o)) stns.push(o); }
  const coloc=(a,b)=>Math.hypot(a.sx-b.sx,a.sy-b.sy)<6;
  let nn=0,ncSelf=0,ncOther=0,cc=0,csOther=0,nsOther=0,npnl=0,cpnl=0,nr=0,nrPoints=0;
  for(let i=0;i<names.length;i++)for(let j=i+1;j<names.length;j++)
    if(cheap(names[i],names[j])&&overlap(names[i].p,names[j].p)) nn++;
  for(const a of names)for(const c of codes)
    if(cheap(a,c)&&overlap(a.p,c.p)){ if(a.t===c.owner) ncSelf++; else ncOther++; }
  for(let i=0;i<codes.length;i++)for(let j=i+1;j<codes.length;j++)
    if(cheap(codes[i],codes[j])&&overlap(codes[i].p,codes[j].p)&&!coloc(codes[i],codes[j])) cc++;
  for(const c of codes)for(const s of stns){
    if(Math.hypot(c.sx-s.x,c.sy-s.y)<6) continue;
    if(cheap(c,s)&&circPoly(s,c.p)) csOther++; }
  for(const a of names)for(const s of stns){
    if(a.t===s.name) continue;
    if(cheap(a,s)&&circPoly(s,a.p)) nsOther++; }
  for(const a of names)for(const q of M.panels){ if(cheap(a,q)&&overlap(a.p,q.p)){ npnl++; break; } }
  for(const c of codes)for(const q of M.panels){ if(cheap(c,q)&&overlap(c.p,q.p)){ cpnl++; break; } }
  /* name-vs-route test: nine sample points (four corners, four edge
     midpoints, the centre). Three or more inside the stroke means the line
     runs through the text; one or two is a corner graze, not a defect. */
  const screenCorners=el=>{
    const b=el.getBBox(),m=el.getScreenCTM(),p=[[b.x,b.y],[b.x+b.width,b.y],
      [b.x+b.width,b.y+b.height],[b.x,b.y+b.height]];
    return p.map(([x,y])=>({x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f}));
  };
  const routes=[...mapEl.querySelectorAll(SEL.route)].map(el=>{
    const r=el.getBoundingClientRect();
    return {el,inv:el.getScreenCTM().inverse(),b:{x0:r.left,x1:r.right,y0:r.top,y1:r.bottom}};
  });
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  for(const a of names){
    const p=screenCorners(a.el), b=bounds(p);
    const pts=[p[0],p[1],p[2],p[3],mid(p[0],p[1]),mid(p[1],p[2]),
      mid(p[2],p[3]),mid(p[3],p[0]),{x:(p[0].x+p[2].x)/2,y:(p[0].y+p[2].y)/2}];
    let hits=0;
    for(const q of pts){
      const sp=root.createSVGPoint();sp.x=q.x;sp.y=q.y;
      for(const r of routes){
        if(r.b.x1<b.x0||b.x1<r.b.x0||r.b.y1<b.y0||b.y1<r.b.y0) continue;
        if(r.el.isPointInStroke(sp.matrixTransform(r.inv))){hits++;break;}
      }
    }
    nrPoints+=hits;if(hits>=3) nr++;
  }
  const rows = [["cnt.nn",nn,0],["cnt.ncSelf",ncSelf,0],["cnt.ncOther",ncOther,0],
                ["cnt.cc",cc,0],["cnt.csOther",csOther,0],["cnt.nsOther",nsOther,0],
                ["cnt.nr",nr,1],["cnt.npnl",npnl,1],["cnt.cpnl",cpnl,1]];
  $("#countTable").innerHTML = rows.map(([k,v,hard])=>
    "<tr><td>"+t(k)+"</td><td class="+((hard&&v)?'"warn"':'""')+">"+v+"</td></tr>").join("")
    + '<tr><td colspan="2" style="color:#777;padding-top:4px">'
    + t("cnt.inView", {names:names.length, codes:codes.length}) + '</td></tr>';
  window.__counts = {nn,ncSelf,ncOther,cc,csOther,nsOther,nr,nrPoints,npnl,cpnl,
                     nName:names.length,nCode:codes.length};
}
RELABEL.push(()=>{ if(mapCTM) recount(); });

function updateMovedCount(){

/* =========================== Export =================================== */
function exportRows(){
  const nameRows = [], codeRows = [], angleRows = [], warn = [], warnUI = [];
  const addWarn=(key,params)=>{
    warn.push(tEnglish(key,params).replace(/[\r\n]+/g," "));
    warnUI.push(tHTML(key,params));
  };
  /* A downstream applier finds a label by "same text, nearest to this
     station". When two stations share a name, dragging one far enough can
     make the *other* label the nearer match — and the applier would then
     silently move the wrong one. Catch that here instead. */
  const sameText = new Map();
  for(const L of M.labels){ if(!sameText.has(L.text)) sameText.set(L.text, []); sameText.get(L.text).push(L); }

  for(const L of M.labels){
    if(!isMoved(L) || !L.st) continue;
    const dx = L.x - L.st.x, dy = L.y - L.st.y;
    const peers = sameText.get(L.text);
    if(peers.length > 1){
      let best = null, bd = Infinity;
      for(const p of peers){ const d = Math.hypot(p.x-L.st.x, p.y-L.st.y); if(d < bd){ bd = d; best = p; } }
      if(best !== L)
        addWarn("warn.dupName", {text:L.text, code:L.st.code});
    }
    if(Math.hypot(dx, dy) > CONFIG.limits.maxOffset)
      addWarn("warn.tooFar", {text:L.text, code:L.st.code,
                               d:fmt(Math.hypot(dx,dy)), max:CONFIG.limits.maxOffset});
    /* The angle column exists to *preserve* the original angle, so it is
       always filled in — None when there is no transform. Writing 0 instead
       makes an applier that compares this column with the file abort. */
    nameRows.push({text:L.text, station:L.st.name, code:L.st.code,
                   dx:+dx.toFixed(4), dy:+dy.toFixed(4), anchor:L.anchor,
                   rot: L.hasRot? L.rot0 : null, ldr: !!L.ldr,
                   why: "label tuner "+stamp()});
    if(L.hasRot && L.rot!==L.rot0){
      /* Angle changes are matched by label text alone, so a duplicated name
         cannot be targeted unambiguously. Flag it and keep the row visible
         rather than dropping it — the user should know why it is excluded. */
      const dup = peers.length > 1;
      if(dup) addWarn("warn.dupAngle", {text:L.text, code:L.st.code});
      angleRows.push({text:L.text, code:L.st.code, from:L.rot0, to:L.rot, dup:dup,
                      why:"label tuner "+stamp()});
    }
    if(L.veto) addWarn("warn.veto", {text:L.text});
  }
  for(const C of M.codes){
    if(!C.grabbed) continue;
    const s = codeSlot(C);
    if(s===C.slot0) continue;
    codeRows.push({name:C.name, gcode:C.dcode, text:C.text, slot:s, was:C.slot0,
                   why:"label tuner "+stamp()});
    if(C.veto) addWarn("warn.codeVeto", {text:C.text});
  }
  return {nameRows, codeRows, angleRows, warn, warnUI};
}
function stamp(){
  const d = new Date();
  return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
}
function py(s){ return '"'+String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"')
  .replace(/\r/g,"\\r").replace(/\n/g,"\\n").replace(/\t/g,"\\t")+'"'; }
/* The move list is a machine artifact for your own generator, so it stays in
   English regardless of the interface language. Format: Python-style tuple
   rows, one section per kind of edit. See README.md § Move list format. */
function exportText(){
  const R = exportRows();
  const out = [];
  out.push("# Move list — exported by Transit Label Tuner");
  out.push("# source diagram : " + SVG_PATH.split("/").pop());
  out.push("# format version : " + PANEL_FORMAT_VERSION);
  out.push("# source fingerprint : " + SOURCE_FINGERPRINT);
  out.push("# If a label already has a NAME_MOVES row, EDIT that row — do not add a second one.");
  out.push("#   Two NAME_MOVES rows for one label: a strict applier aborts.");
  out.push("#   Two CODE_NUDGES rows for one code: the later row silently wins.");
  if(R.warn.length){ out.push("# !! unresolved:"); for(const w of R.warn) out.push("#    "+w); }
  out.push("");
  out.push("# ---- NAME_MOVES (label text, station name, station code, dx, dy, anchor, angle, has leader, why) ----");
  for(const r of R.nameRows)
    out.push("    ("+py(r.text)+", "+py(r.station)+", "+py(r.code)+", "+fmt(r.dx)+", "+fmt(r.dy)
             +", "+py(r.anchor)+", "+(r.rot===null? "None" : fmt(r.rot))+", "+(r.ldr?"True":"False")
             +",\n     "+py(r.why)+"),");
  if(!R.nameRows.length) out.push("    # (none)");
  out.push("");
  out.push("# ---- CODE_NUDGES (station name, group data-code, code text, new quadrant, old quadrant, why) ----");
  for(const r of R.codeRows)
    out.push("    ("+py(r.name)+", "+py(r.gcode)+", "+py(r.text)+", "+py(r.slot)+", "+py(r.was)
             +", "+py(r.why)+"),");
  if(!R.codeRows.length) out.push("    # (none)");
  if(R.angleRows.length){
    const ok = R.angleRows.filter(r=>!r.dup), bad = R.angleRows.filter(r=>r.dup);
    out.push("");
    out.push("# ---- CHAIN_ANGLES (chain name, [labels...], old angle, new angle, why) ----");
    out.push("#      Angle changes live here, NOT in NAME_MOVES: that column preserves the");
    out.push("#      original angle, and writing a new value there makes an applier abort on");
    out.push("#      \"table says X, file says Y\". A single-member row rotates one label and");
    out.push("#      touches nothing else, so the same label may legitimately appear in both");
    out.push("#      NAME_MOVES (moved) and here (rotated).");
    for(const r of ok)
      out.push("    ("+py(r.text+" "+r.code+" single")+", ["+py(r.text)+"], "
               +fmt(r.from)+", "+fmt(r.to)+", "+py(r.why)+"),");
    if(!ok.length) out.push("    # (no usable rows)");
    if(bad.length){
      out.push("");
      out.push("# These changed angle but are NOT usable (duplicated label text would make a");
      out.push("# text-matched angle table abort). Listed verbatim rather than dropped:");
      for(const r of bad)
        out.push("#    "+r.text+"("+r.code+")  "+fmt(r.from)+"° -> "+fmt(r.to)+"°");
    }
  }
  return out.join("\n");
}

/* =========================== Scripting hooks ==========================
   Drag interactions cannot be verified by a headless screenshot, so the
   behaviour has to be drivable from a script. Every hook below runs the
   **same** snap and guard path as a real drag — none of them is a shortcut
   around it. Messages here are developer-facing and stay in English.
   ===================================================================== */
window.applyMove = function(key, dx, dy){
  const L = M.byKey.get(key);
  if(!L) throw new Error("No label for key "+key);
  if(!L.st) throw new Error(key+" has no matching station");
  pushUndo();
  L.x += dx; L.y += dy;
  L.x = L.x0 + Math.round(L.x - L.x0);      /* same snap as mouseup */
  L.y = L.y0 + Math.round(L.y - L.y0);
  writeLabel(L); scheduleCount(); updateMovedCount();
  return {key, x:L.x, y:L.y, dx:+(L.x-L.st.x).toFixed(4), dy:+(L.y-L.st.y).toFixed(4),
          anchor:L.anchor, rot:L.hasRot?L.rot:null, ldr:!!L.ldr, veto:L.veto};
};
window.applyCodeMove = function(key, dx, dy){
  const C = M.codeByKey.get(key);
  if(!C) throw new Error("No code for key "+key);
  pushUndo();
  C.x += dx; C.y += dy;
  const s = SLOTS[nearestSlot(C.x-C.sx, C.y-C.sy)];   /* same snap as mouseup */
  C.x = C.sx+s[0]; C.y = C.sy+s[1]; C.anchor = s[2]; C.grabbed = true;
  writeCode(C); scheduleCount(); updateMovedCount();
  return {key, slot:codeSlot(C), was:C.slot0, veto:C.veto};
};
/* Shares setAngle with the [ ] \ keys rather than reimplementing it — a
   parallel path is exactly how you end up forgetting to re-run the overlap
   count after a keyboard angle change. */
window.applyAngle = function(key, ang){
  const L = M.byKey.get(key);
  if(!L) throw new Error("No label for key "+key);
  setAngle(L, ang);
  return {key, rot:L.rot};
};
/* Synthesises a real drag (mousedown -> mousemove -> mouseup) so the actual
   handlers and the screen->map conversion are what gets exercised, not a
   shortcut past them. px/py are **screen pixels**. */
window.dragPx = function(key, px, py, kind){
  const o = (kind==="code") ? M.codeByKey.get(key) : M.byKey.get(key);
  if(!o) throw new Error("Not found: "+key);
  const r = o.el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const ev = (type,x,y)=>new MouseEvent(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,button:0});
  o.el.dispatchEvent(ev("mousedown", cx, cy));
  window.dispatchEvent(ev("mousemove", cx+px, cy+py));
  window.dispatchEvent(ev("mouseup",   cx+px, cy+py));
  if(kind==="code") return {key, slot:codeSlot(o), was:o.slot0};
  return {key, dx:+(o.x-o.st.x).toFixed(4), dy:+(o.y-o.st.y).toFixed(4),
          movedX:+(o.x-o.x0).toFixed(4), movedY:+(o.y-o.y0).toFixed(4), veto:o.veto};
};
window.mapScale = userScale;
window.focusOn = function(key, z){
  const L = M.byKey.get(key); if(!L) throw new Error("Not found: "+key);
  zoom = z; applyView();
  const p = root.createSVGPoint(); p.x = L.x; p.y = L.y;
  const q = p.matrixTransform(mapCTM);
  const r = stage.getBoundingClientRect();
  panX += (r.left + r.width/2) - q.x;
  panY += (r.top + r.height/2) - q.y;
  applyView(); recount();
  return {focus:key, zoom:z, scale:userScale()};
};
window.exportMoves = exportRows;
window.exportText  = exportText;
window.undo = ()=>{ const s=M.undo.pop(); if(s) restore(s); };
window.resetAll = ()=>{ pushUndo();

  for(const C of M.codes){ C.x=C.x0; C.y=C.y0; C.anchor=C.anchor0; C.grabbed=false; writeCode(C); }
