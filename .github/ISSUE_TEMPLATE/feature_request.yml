name: Feature request
description: Propose a change to what the tool does.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please skim "Things that are deliberate, not accidental" in
        CONTRIBUTING.md first. Several apparent gaps — the tool never writing
        SVG, snapping refusing off-ladder values, the export staying in
        English — are design decisions with reasons behind them. If you want
        one of those changed, say why the reason does not hold for your case;
        that is a much more interesting discussion than the feature itself.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that the tool makes hard?
      description: Describe the situation, not the solution you have in mind.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations: {required: true}
  - type: dropdown
    id: kind
    attributes:
      label: Could this be a CONFIG change rather than a code change?
      options:
        - "Yes — it is diagram-specific and belongs in CONFIG"
        - "No — it changes behaviour for everyone"
        - "Not sure"
    validations: {required: true}
