name: self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome

      - name: The demo map is exactly what the generator produces
        run: |
          python3 tools/make_demo_map.py
          git diff --exit-code demo/demo-map.svg

      - name: Audit translations, theme tokens, demo contract and screenshots
        run: python3 tools/static_audit.py

      - name: Run the self-test
        run: python3 tools/selftest.py --chrome "${{ steps.chrome.outputs.chrome-path }}"
